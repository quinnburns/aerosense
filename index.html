  const ranges=[m.set&&!m.limitOnly?['Set range',m.set[0]+'–'+m.set[1]+(m.u==='%'?'%':' '+m.u)]:null,m.limitOnly?['Alarm limit',m.set[1]+' '+m.u+' (at the ventilator)']:null,m.crit?['Critical threshold','Below '+m.crit+'%']:null,m.usual?['Lila’s usual',m.usual]:null].filter(Boolean);
  const html=`<div class="pad">${backBtn()}

  ${(()=>{const es=epSummary(mid,ser);const ep=m.cat?null:episodes(mid,ser);const ty=m.cat?null:typical(mid,ser);
   return`<dl class="list facts"><div><dt>${m.cat?'This period':mid==='pip'?'Above alarm limit':mid==='temp'?'Compared with usual':'Outside Lila\u2019s range'}</dt><dd class="${es.c==='ok'?'':es.c}">${m.cat?es.t:ep&&ep.count?`${ep.count===1?'Once':ep.count+' times'}${ep.mins!=null?' · '+durTxt(ep.mins)+' total':''}`:es.t}</dd></div>

  ${ranges.length?`<div class="sec-h"><span class="eyebrow">Lila’s ranges</span></div><dl class="list facts">${ranges.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`:''}

/* Docked view — bedside-monitor treatment.
   Left: Lila's HALO vitals on the background (no nested cards), anchored in every state.
   Right: one status panel whose size and color follow urgency. */
function dkRange(mid,v,w){const m=MET[mid];const Zs=zonesOf(mid);const pos=x=>Math.max(0,Math.min(100,(x-m.lo)/(m.hi-m.lo)*100));
  const vz=v==null?null:Zs.find(z=>v>=z.a&&v<z.b)||Zs[Zs.length-1];
  return`<div class="dkr" style="width:${w}"><div class="dkr-b">${Zs.map(z=>`<i class="${z.c}" style="left:${pos(z.a)}%;width:${pos(z.b)-pos(z.a)}%"></i>`).join('')}${v!=null?`<b class="${vz.c}" style="left:${pos(v)}%"></b>`:''}</div>
   <div class="dkr-t">${[...new Set(Zs.slice(1).map(z=>z.a))].map(t=>`<span style="left:${pos(t)}%">${t}</span>`).join('')}</div></div>`;}
function dockStatus(){const a=active().sort((x,y)=>sevRank[y.level]-sevRank[x.level]);
  const crit=a.find(e=>e.level==='critical'),att=a.find(e=>e.level==='attention'),off=a.find(e=>e.level==='conn');
  const hs=S.halo.st,vs=S.vent.st;
  if(crit&&crit.kind==='standby')return{tone:'crit',ic:'oct',kick:`AeroSync · since ${hm(crit.start)}`,title:'Ventilation off',body:'AeroSync is not ventilating Lila. Bag her or restart it below.',btn:['crit','Open bagging steps','pressure',crit.id,5],foot:['vent','Restart: hold ⏻ on the ventilator 3 s']};
  if(crit&&crit.kind==='pressure'){const low=a.find(e=>e.kind==='lowspo2');
    return{tone:'crit',ic:'oct',kick:`AeroSync alarm · since ${hm(crit.start)}`,title:'High airway pressure',
     body:low?'Low SpO₂ at the same time — shown together, not as cause and effect.':hs==='off'?'HALO isn’t connected. The alarm still applies.':'Lila’s HALO readings are in range. The alarm still applies.',
     btn:['crit','Open emergency response','pressure',crit.id],foot:['mute',vMuteLeft()?`Audio paused at the ventilator · ${mmss(vMuteLeft())}`:'Silence or reset only at the ventilator']};}
  if(crit)return{tone:'crit',ic:'oct',kick:`HALO · since ${hm(crit.start)}`,title:'Oxygen critically low',body:`SpO₂ ${S.v.spo2}% is below Lila’s critical threshold (${TH.spo2Crit}%). ${vs==='off'?'AeroSync isn’t connected.':'No ventilator alarm.'}`,btn:['crit','Open emergency response','lowspo2',crit.id],foot:['info','Thresholds are simulated']};
  if(att&&att.kind==='sound')return{tone:'att',ic:'tri',kick:`HALO · ${hm(att.start)}`,title:'Possible secretions in trach',body:`Suctioning may be needed. Movement is up too (${S.v.move.toLowerCase()}). No ventilator alarm.`,btn:['att','Open secretions response','sound',att.id],foot:['info','Concept sensing — confirm by checking Lila']};
  if(att)return{tone:'att',ic:'tri',kick:`HALO · ${hm(att.start)}`,title:'Oxygen below range',body:`SpO₂ ${S.v.spo2}%, set range 92–100. No ventilator alarm — that doesn’t mean Lila is okay. Check on her.`,btn:['att','Open care plan','lowspo2',att.id]};
  if(off&&off.kind==='halo_off')return{tone:'off',ic:'offline',kick:`HALO · since ${hm(S.halo.since)}`,title:'HALO not connected',body:'Lila’s readings can’t be shown. Check on her directly, then HALO’s fit and charge.',foot:['vent','AeroSync connected · no alarm']};

function vTile(k,label,unit,ic,val,st,arrow){const r=VT[k];const W=170;const px=x=>Math.max(0,Math.min(W,(x-r.lo)/(r.hi-r.lo)*W));const over=val>r.hi;

function vWave(kind,crit,flat){const v=S.v;const P=240,H=64,period=60/Math.max(6,v.rr);const f=Math.min(.45,S.vset.ti/period);let d='';

  else for(let k=0;k<5;k++){const o=k*P;
    if(kind==='p'){const y=x=>H-6-(x/40)*(H-12);const peep=y(S.vset.peep),pk=y(v.pip);d+=`${k?'L':'M'}${o} ${peep} L${o+.06*P} ${peep} L${o+.1*P} ${pk} L${o+(.1+f-.04)*P} ${y(v.pip*.95)} L${o+(.1+f)*P} ${peep} L${o+P} ${peep} `;}
    else{const m=H/2,F=22,a=o+.1*P,b=o+(.1+f)*P;d+=`${k?'L':'M'}${o} ${m} L${a} ${m} L${a+2} ${m-F} L${b} ${m-F*.45} L${b+2} ${m+F} `;for(let j=1;j<=8;j++){d+=`L${b+2+j*(.5*P/8)} ${m+F*Math.exp(-j*.6)} `;}d+=`L${o+P} ${m} `;}}

  return`<svg class="v-wsvg" viewBox="0 0 720 ${H}" preserveAspectRatio="none">${lim}<g class="${flat?'':'v-wg'}" style="animation-duration:${period}s;animation-delay:${-(t%period)}s"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/></g></svg>`;}

   <div class="cp-range"><span class="cp-pill">${I('clock',15)}${CPR[S.pt.range][2]} · ${hm(cpWin().start)} – ${hm(now())}</span><span class="cp-sync">${I('check',14)}Last sync ${lastSync} · Ventilator <i class="dot" style="color:${S.vent.st==='live'?'#2E8574':'#C4362F'}"></i> HALO <i class="dot" style="color:${S.halo.st==='live'?'#2E8574':S.halo.st==='stale'?'#B87A12':'#C4362F'}"></i></span></div></div>`;}
/* --- pages --- */
function cpPatients(){const P=S.pt;const lilaN=S.events.filter(e=>cpNeeds(e)&&e.start>new Date(+now()-12*3600e3)).length;const lilaE=S.events.slice().sort((a,b)=>b.start-a.start)[0];
  const rows=PATIENTS.map(p=>p.id==='lila'?{...p,st:lilaN?'await':'ok',stl:lilaN?`${lilaN} event${lilaN>1?'s':''} awaiting review`:'Reviewed · no new events',ev:lilaE?`${cpTitle(lilaE)} · ${hm(lilaE.start)}`:'No recorded events',last:S.halo.st==='live'&&S.vent.st==='live'?hm(now()):'Interrupted',lastS:S.halo.st!=='live'?'HALO '+S.halo.st:S.vent.st!=='live'?'Ventilator not connected':'Both devices',warn:S.halo.st!=='live'||S.vent.st!=='live',t:9}:p)
   .filter(p=>P.filter==='all'||(P.filter==='await'&&p.st==='await')||(P.filter==='int'&&(p.st==='int'||p.warn)))
   .filter(p=>!P.search||p.n.toLowerCase().includes(P.search.toLowerCase())||p.pid.toLowerCase().includes(P.search.toLowerCase()))
   .sort((a,b)=>P.sort==='name'?a.n.localeCompare(b.n):b.t-a.t);
  const aw=PATIENTS.filter(p=>p.st==='await').length+(lilaN?1:0),int=PATIENTS.filter(p=>p.st==='int'||p.warn).length+((S.halo.st!=='live'||S.vent.st!=='live')?1:0);
  const chip=c=>({await:'cp-st aw',int:'cp-st int',ok:'cp-st ok',none:'cp-st ok'})[c];
  return`<div class="cp-main"><div class="cp-ttl"><div><h1>My Patients</h1><p>Pediatric home-ventilation patients assigned to you · recorded data for review, not continuous surveillance</p></div><span class="cp-pill">6 assigned · last refreshed ${hm(now())}</span></div>
   <div class="cp-stats"><div><b>6</b><span><strong>Assigned patients</strong>All patients you are authorized to view</span></div><div><b class="aw">${aw}</b><span><strong>Awaiting review</strong>Recorded events not yet reviewed — not a measure of urgency</span></div><div><b>${int}</b><span><strong>Data interruptions</strong>Patients with missing or stale device data</span></div></div>
   <div class="cp-tools"><label class="cp-search">${I('info',16)}<input id="cpSearch" data-cpin="search" placeholder="Search by name or patient ID" value="${esc(P.search)}"></label>
    ${[['all','All'],['await','Awaiting review'],['int','Data interrupted']].map(([k,l])=>`<button class="cp-chip ${P.filter===k?'on':''}" data-act="cp" data-do="filter" data-f="${k}">${l}</button>`).join('')}
    <button class="cp-sort" data-act="cp" data-do="sort">${I('trends',15)}Sort: ${P.sort==='name'?'Name':'Most recent event'}</button></div>
   <div class="cp-table"><div class="cp-tr h"><span>PATIENT</span><span>AGE</span><span>REVIEW STATUS</span><span>RECENT EVENT</span><span>LAST DATA RECEIVED</span><span></span></div>
    ${rows.map(p=>`<div class="cp-tr"><span class="cp-pn"><span class="av sm">${p.n[0]}</span><span><b>${p.n}</b><small>${p.pid} · fictional</small></span></span><span>${p.age}</span><span><i class="${chip(p.st)}">${p.stl}</i></span><span class="cp-ev">${p.ev}</span><span class="${p.warn?'warn':''}"><b>${p.last}</b><small>${p.lastS}</small></span><span><button class="cp-open" data-act="cp" data-do="${p.id==='lila'?'page':'preview'}" data-p="overview" data-id="${p.id}">Open</button></span></div>`).join('')||'<p class="cp-empty">No patients match. Clear the search or filter.</p>'}</div>
   <p class="cp-fn">Awaiting review reflects documentation status only — it does not rank clinical urgency.</p></div>`;}
function cpOverview(){const win=cpWin();const [span,cnt]=CPR[S.pt.range];const times=cpTimes(span,cnt);
  const evs=cpEvs(win,e=>e.level!=='info');const need=evs.filter(cpNeeds);
  const top=evs.find(e=>e.level==='critical')||evs[0];
  const sum=top?{h:`${top.level==='critical'?'A '+cpTitle(top).charAt(0).toLowerCase()+cpTitle(top).slice(1):cpTitle(top)} was recorded at ${hm(top.start)}`,p:evs.length>1?`${evs.length} events in this period: ${evs.map(e=>cpTitle(e)+' ('+hm(e.start)+')').join(' · ')}.`:`${cpSrc(top)} · ${top.end?'ended '+hm(top.end):'still active'}.`}:{h:'Measurements were consistent over the selected period',p:`No recorded events. HALO and ventilator data cover the full ${CPR[S.pt.range][2].replace('Last ','')}.`};
  const cov=t=>{const v=times.map(x=>cpVal(t,x));return Math.round(100*v.filter(z=>z!=null).length/v.length);};
  const card=(mid,lab,u,src,ic)=>{const vals=times.map(t=>cpVal(mid,t));const v=vals.filter(x=>x!=null);const cur=vals[vals.length-1];const m=MET[mid];
    const lo=v.length?Math.min(...v):null,hi=v.length?Math.max(...v):null;const lt=times[vals.indexOf(lo)],ht=times[vals.indexOf(hi)];
    const note=!v.length?'No data':mid==='spo2'?(lo<92?`▼ low ${lo} at ${hm(lt)}`:'No change · low '+lo):mid==='pip'?(hi>S.vlim.pipHi?`▲ peak ${hi} at ${hm(ht)}`:'No change · peak '+hi):hi>m.set[1]?`▲ peak ${hi} at ${hm(ht)}`:`No change · ${lo}–${hi}`;
    const warn=note.startsWith('▼')||note.startsWith('▲');
    return`<button class="cp-mc" data-act="cp" data-do="page" data-p="trends"><div class="cp-mh">${I(ic,15)}${lab}<em>${src}</em></div><div class="cp-mv"><b>${cur??'—'}</b><small>${u}</small>${cpSpark(mid,times)}</div><div class="cp-mn ${warn?'w':''}">${note}</div><div class="cp-mr">${mid==='pip'?'Alarm limit '+S.vlim.pipHi:'Range '+m.set[0]+'–'+m.set[1]}</div></button>`;};
  return`<div class="cp-main">${cpHead()}${rxAlert()}
   <section class="cp-sum"><div><span class="cp-k">RESPIRATORY MONITORING SUMMARY</span><h2>${sum.h}</h2><p>${sum.p}</p><small>Factual summary of recorded data · not a diagnosis</small></div>
    <div class="cp-sumc"><span><i class="dot" style="color:#2E8574"></i>Coverage ${cov('spo2')}% · ${cov('rr')}%</span><span><i class="dot" style="color:${evs.length?'#B87A12':'#2E8574'}"></i>${evs.length?'Notable changes':'No notable changes'}</span><span><i class="dot" style="color:${evs.some(e=>e.level==='critical')?'#C4362F':'#5E7080'}"></i>${evs.length} events${evs.some(e=>e.level==='critical')?' · '+evs.filter(e=>e.level==='critical').length+' high priority':''}</span></div></section>
   <div class="cp-mcs">${card('spo2','SpO₂','%','HALO','o2')}${card('hr','Heart rate','bpm','HALO','heart')}${card('rr','Breathing rate','/min','Ventilator','lungs')}${card('pip','Peak pressure','cmH₂O','Ventilator','gauge')}</div>
   <div class="cp-row"><section class="cp-card grow"><div class="cp-ch"><div><h3>Combined HALO + ventilator trends</h3><small>Synchronized lanes · shared time axis · hover to read values</small></div><div class="cp-seg">${Object.keys(CPR).map(k=>`<button class="${S.pt.range===k?'on':''}" data-act="cp" data-do="range" data-r="${k}">${k.replace('h',' h').replace('d',' d')}</button>`).join('')}</div></div>${cpLanes(times,CPM.map(c=>c[0]),{W:900,LH:52})}</section>
    <div class="cp-col"><section class="cp-card"><div class="cp-ch"><h3>Events requiring review</h3><button class="cp-link" data-act="cp" data-do="page" data-p="events">View all ›</button></div>
      ${need.length?need.slice(0,4).map(e=>`<button class="cp-er" data-act="cp" data-do="event" data-id="${e.id}"><i class="cp-dia ${e.level}"></i><span><b>${cpTitle(e)}</b><small>${hm(e.start)} · ${cpSrc(e)}</small></span><em class="${e.level==='critical'?'hp':'nr'}">${e.level==='critical'?'High priority':'Needs review'}</em></button>`).join(''):`<div class="cp-none"><b>No events need review</b><small>Nothing to review for this period.</small></div>`}</section>
     <section class="cp-card"><h3>Equipment &amp; data quality</h3><small class="cp-sub">Connectivity is not physiological status</small>
      <div class="cp-eq">${I('vent',18)}<span><b>AeroSync ventilator</b><small class="${S.vent.st==='live'&&!(S.vui&&S.vui.standby)?'ok':'bad'}">${S.vui&&S.vui.standby?'● Ventilation off at device':S.vent.st==='live'?'● Connected · data '+cov('rr')+'%':'● Not connected'}</small><small>Battery 84% recorded · wall power</small></span></div>
      <div class="cp-eq">${I('halo',18)}<span><b>HALO trach tie</b><small class="${S.halo.st==='live'?'ok':'bad'}">● ${S.halo.st==='live'?'Connected · data '+cov('spo2')+'%':S.halo.st==='stale'?'Delayed':'Not connected'}</small><small>Battery 76% · signal quality good</small></span></div></section></div></div></div>`;}
function cpEvents(){const P=S.pt;const all=S.events.filter(e=>e.level!=='info').sort((a,b)=>b.start-a.start);
  const list=all.filter(e=>P.evFilter==='all'||(P.evFilter==='vent'&&e.device==='AeroSync')||(P.evFilter==='halo'&&e.device==='HALO')||(P.evFilter==='need'&&cpNeeds(e)));
  const e=S.events.find(x=>x.id===P.evId)||list[0];
  let det='<div class="cp-card grow"><p>No events.</p></div>';
  if(e){const t0=+e.start,t1=+(e.end||now());const b=new Date(t0-15*60e3),a=new Date(t1+15*60e3>+now()?+now():t1+15*60e3);
    const tri=(mid,lab,u)=>{const v=[cpVal(mid,b),cpVal(mid,e.start),cpVal(mid,a)];return`<div class="cp-tri"><div class="cp-mh">${lab}<em>${u}</em></div><div class="cp-tv"><span><b>${v[0]??'—'}</b><small>−15 min</small></span><span class="at"><b>${v[1]??'—'}</b><small>at event</small></span><span><b>${v[2]??'—'}</b><small>${e.end?'+15 min':'now'}</small></span></div></div>`;};
    const times=cpTimes(Math.max(90*60e3,t1-t0+90*60e3),61,new Date(Math.min(+now(),t1+45*60e3)));
    const conc=concurrentOf(e);
    const facts=[e.kind==='pressure'?`Ventilator recorded a high airway pressure alarm at ${hm(e.start)}: peak ${e.peak||34} cmH₂O against a limit of ${S.vlim.pipHi}.`:e.kind==='lowspo2'?`HALO recorded SpO₂ ${e.value}% below the set range (${TH.spo2Lo}–100) at ${hm(e.start)}.`:e.kind==='sound'?`HALO recorded a change in the acoustic signal at ${hm(e.start)} (experimental sensing).`:`${cpTitle(e)} at ${hm(e.start)}.`,
      ...conc.map(c=>`At the same time: ${cpTitle(c)} (${hm(c.start)}, ${cpSrc(c)}).`),
      e.end?`Ended at the device at ${hm(e.end)} · lasted ${dur(e.start,e.end)}.`:'Still active at the time of review.',
      conc.length?'Timing does not establish cause.':''].filter(Boolean);
    det=`<div class="cp-col grow"><section class="cp-card"><div class="cp-evh"><span class="cp-evi ${e.level}">${I(e.level==='critical'?'tri':e.level==='conn'?'offline':'tri',22)}</span><div><h2>${cpTitle(e)}</h2><small>${fmt(e.start)}${e.end?' · '+dur(e.start,e.end):''} · ${e.device==='AeroSync'?'AeroSync ventilator':'HALO'}</small>
      <div class="cp-tags"><i class="${e.level==='critical'?'hp':'nr'}">${e.level==='critical'?'High priority':e.level==='conn'?'Data quality':'Needs review'}</i><i class="${e.crev?'rv':'nrv'}">${e.crev?I('check',13)+'Reviewed · J. Rivera · '+hm(e.crev):'Not yet reviewed'}</i><i class="g">${e.end?'Resolved at device '+hm(e.end):'Active'}</i></div></div><p class="cp-evn">“Reviewed” records your review. It does not resolve the event at the device.</p></div></section>
     <div class="cp-tris">${tri('spo2','SpO₂','%')}${tri('hr','Heart rate','bpm')}${tri('rr','Breathing rate','/min')}${tri('pip','Peak pressure','cmH₂O')}</div>
     <section class="cp-card"><h3>Before, during and after</h3><small class="cp-sub">Shared time axis · 5-minute samples · simulated</small>${cpLanes(times,CPM.map(c=>c[0]),{W:820,LH:44,id:'ev',during:[e.start,e.end||now()]})}</section>
     <div class="cp-row2"><section class="cp-sys"><span class="cp-k">${I('info',14)} SYSTEM-GENERATED · FACTUAL, NOT A DIAGNOSIS</span><ul>${facts.map(f=>`<li>${f}</li>`).join('')}</ul><small>Data quality: HALO ${S.halo.st==='live'?'good':'interrupted'} · Ventilator ${S.vent.st==='live'?'complete':'interrupted'}</small></section>
      <section class="cp-card cp-note"><span class="cp-k">${I('plan',14)} CLINICIAN NOTE · YOUR WORDS</span><textarea data-cpin="note" data-id="${e.id}" placeholder="Add a note about this event…" ${e.crev?'readonly':''}>${esc(e.cnote||'')}</textarea>
       ${e.crev?`<button class="cp-btn ok" data-act="cp" data-do="unreview" data-id="${e.id}">${I('check',16)}Reviewed · undo</button>`:`<button class="cp-btn" data-act="cp" data-do="review" data-id="${e.id}">Mark as reviewed</button>`}</section></div></div>`;}
  return`<div class="cp-main">${cpHead()}${rxAlert()}<div class="cp-crumb"><button data-act="cp" data-do="page" data-p="overview">Overview</button> › Events${e?' › '+cpTitle(e):''}</div>
   <div class="cp-row"><section class="cp-card cp-evlist"><h3>Recorded events</h3><small class="cp-sub">Last 7 days</small><div class="cp-chips">${[['all','All'],['vent','Ventilator'],['halo','HALO'],['need','Needs review']].map(([k,l])=>`<button class="cp-chip ${P.evFilter===k?'on':''}" data-act="cp" data-do="evfilter" data-f="${k}">${l}</button>`).join('')}</div>
    ${list.map(x=>`<button class="cp-ei ${e&&x.id===e.id?'on':''}" data-act="cp" data-do="event" data-id="${x.id}"><i class="cp-dia ${x.level}"></i><span><b>${cpTitle(x)}</b><small>${fmt(x.start)} · ${cpSrc(x)} · ${x.crev?'Reviewed':x.level==='critical'?'High priority':'Needs review'}</small></span></button>`).join('')||'<p class="cp-sub">No events match.</p>'}<p class="cp-fn">Filters and review status apply to this list only.</p></section>${det}</div></div>`;}
function cpTrends(){const [span,cnt]=CPR[S.pt.range];const times=cpTimes(span,cnt);const on=CPM.filter(c=>S.pt.tog[c[0]]).map(c=>c[0]);
  const stat=mid=>{const v=times.map(t=>cpVal(mid,t)).filter(x=>x!=null);if(!v.length)return null;const s=[...v].sort((a,b)=>a-b);const m=MET[mid];const out=m.set&&!m.cat?v.filter(x=>mid==='pip'?x>m.set[1]:(x<m.set[0]||x>m.set[1])).length:v.filter(x=>x).length;
    return{min:s[0],med:s[Math.floor(s.length/2)],max:s[s.length-1],out:Math.round(out*span/cnt/60000),cov:Math.round(100*v.length/times.length)};};
  return`<div class="cp-main">${cpHead()}${rxAlert()}<div class="cp-crumb"><button data-act="cp" data-do="page" data-p="overview">Overview</button> › Trends</div>
   <section class="cp-card"><div class="cp-ch"><div><h3>Detailed trends</h3><small>Choose measurements · hover to read synchronized values</small></div><div class="cp-seg">${Object.keys(CPR).map(k=>`<button class="${S.pt.range===k?'on':''}" data-act="cp" data-do="range" data-r="${k}">${k.replace('h',' h').replace('d',' d')}</button>`).join('')}</div></div>
    <div class="cp-chips">${CPM.map(c=>`<button class="cp-chip cptg ${S.pt.tog[c[0]]?'on':''}" data-act="cp" data-do="tog" data-m="${c[0]}"><i style="background:${c[4]}"></i>${c[1]}</button>`).join('')}</div>
    ${on.length?cpLanes(times,on,{W:1120,LH:Math.min(110,Math.floor(460/on.length)),id:'tr'}):'<p class="cp-sub">Select at least one measurement.</p>'}</section>
   <section class="cp-card"><h3>Summary · ${CPR[S.pt.range][2]}</h3><div class="cp-table sm"><div class="cp-tr h"><span>MEASUREMENT</span><span>SOURCE</span><span>MIN</span><span>MEDIAN</span><span>MAX</span><span>OUTSIDE RANGE</span><span>DATA COVERAGE</span></div>
    ${CPM.filter(c=>c[0]!=='airway').map(c=>{const s=stat(c[0]);return`<div class="cp-tr"><span><b style="color:${c[4]}">${c[1]}</b></span><span>${c[3]}</span><span>${s?s.min:'—'}</span><span>${s?s.med:'—'}</span><span>${s?s.max:'—'}</span><span class="${s&&s.out?'warn':''}">${s?(s.out?'≈ '+s.out+' min':'None'):'—'}</span><span>${s?s.cov+'%':'—'}</span></div>`;}).join('')}</div></section></div>`;}
function cpDevices(){const z=S.vset,L=S.vlim;const ints=S.events.filter(e=>e.level==='conn').sort((a,b)=>b.start-a.start);
  const r=(k,v)=>`<div class="cp-kv"><span>${k}</span><b>${v}</b></div>`;
  return`<div class="cp-main">${cpHead()}${rxAlert()}<div class="cp-crumb"><button data-act="cp" data-do="page" data-p="overview">Overview</button> › Devices</div>
   <div class="cp-row"><section class="cp-card grow"><div class="cp-ch"><h3>${I('vent',18)} AeroSync ventilator</h3><i class="cp-st ${S.vent.st==='live'&&!S.vui.standby?'ok':'int'}">${S.vui.standby?'Ventilation off at device':S.vent.st==='live'?'Connected':'Not connected'}</i></div>
     ${rxCard()}</section>
    <div class="cp-col grow">${rxHistory()}<section class="cp-card"><div class="cp-ch"><h3>${I('halo',18)} HALO trach tie</h3><i class="cp-st ${S.halo.st==='live'?'ok':'int'}">${S.halo.st==='live'?'Connected':S.halo.st==='stale'?'Delayed':'Not connected'}</i></div>
      ${r('Side pod · SpO₂, pulse, skin temp','Signal good')}${r('Front acoustic sensor','Experimental · active')}${r('Rear electronics module','Battery 76%')}${r('Washable tie','Set A · swap due tonight')}</section>
     <section class="cp-card"><h3>Data interruptions · last 7 days</h3>${ints.map(e=>`<div class="cp-kv"><span>${cpSrc(e)} · ${fmt(e.start)}</span><b>${e.end?dur(e.start,e.end):'ongoing'}</b></div>`).join('')||'<p class="cp-sub">None.</p>'}</section></div></div></div>`;}
function cpCare(){const keys=RESP_ORDER;
  return`<div class="cp-main">${cpHead()}${rxAlert()}<div class="cp-crumb"><button data-act="cp" data-do="page" data-p="overview">Overview</button> › Care Plan</div>
   <section class="cp-card"><div class="cp-ch"><div><h3>Emergency responses</h3><small>What caregivers see on the AeroSense app. Approve a draft to publish it to Lila’s caregivers.</small></div></div>
    ${keys.map(k=>{const R=RESP[k];const ap=S.cp[k];const open=S.pt.cpOpen===k;return`<div class="cp-cpr ${open?'open':''}"><button class="cp-cph" data-act="cp" data-do="cpopen" data-k="${k}"><b>${R.title}</b><i class="cp-st ${ap?'ok':R.status==='draft'?'aw':'none'}">${ap?'Approved · J. Rivera':R.status==='draft'?'Draft · '+R.steps.length+' steps':'Not written'}</i>${I(open?'chevd':'chev',16)}</button>
     ${open?(R.status==='draft'?`<ol class="cp-steps">${R.steps.map(s=>`<li><b>${s.t}</b><span>${s.do.join(' · ').replace(/[⟦⟧]/g,'')}</span></li>`).join('')}</ol><p class="cp-fn">${R.src}</p><div class="cp-cpa">${ap?`<button class="cp-btn ok" data-act="cp" data-do="unapprove" data-k="${k}">${I('check',16)}Approved · undo</button>`:`<button class="cp-btn" data-act="cp" data-do="approve" data-k="${k}">Approve for caregivers</button>`}</div>`:`<p class="cp-sub" style="padding:0 16px 14px">No response written yet. Caregivers see “Not written yet” and the care-team contacts.</p>`):''}</div>`;}).join('')}</section></div>`;}

/* ---------- Round 6 · Apple Watch companion ----------
   Glanceable second channel: Is Lila okay? SpO₂ first, pulse + RR second.
   Screen priority is enforced in wLive(): Critical (AeroSync) → Attention (HALO, only while HALO is live) → data availability → Normal.
   No silence / acknowledge / clear / settings controls — AeroSync stays the primary alarm. Reads the same simulated data. */
function wAlarm(){const a=active();const e=a.find(x=>x.kind==='standby')||a.find(x=>x.kind==='pressure')||a.find(x=>x.kind==='lowspo2'&&x.level==='critical');if(!e)return null;
  if(e.kind==='pressure')return{id:e.id,title:'High airway pressure',src:'AeroSync',val:S.v.pip,unit:'cmH₂O',lab:'PIP',lim:S.vlim.pipHi+' cmH₂O',start:e.start,ill:true};
  if(e.kind==='standby')return{id:e.id,title:'Ventilation off',src:'AeroSync',val:'Off',unit:'',lab:'ventilation',lim:'Turned off at device',start:e.start};
  return{id:e.id,title:'Low oxygen',src:'HALO',val:S.v.spo2,unit:'%',lab:'SpO₂',lim:'Below '+TH.spo2Crit+'%',start:e.start,ill:true};}
const wAgo=d=>{const m=Math.floor((now()-d)/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h ago';};
/* Priority-ordered screen resolver. Navigation state (S.w.page) is only a request; it can never outrank an active alarm. */
function wLive(){const W=S.w;const hs=S.halo.st,vs=S.vent.st;
  const attEv=active().find(e=>e.level==='attention');
  const att=attEv&&hs==='live'?attEv:null;                       // a HALO notice is only "current" while HALO is live
  const prevAtt=hs!=='live'&&W.prevAtt?W.prevAtt:null;            // detected before HALO went offline / delayed
  const base={spo2:S.v.spo2,hr:S.v.hr,rr:S.v.rr,pip:S.v.pip,vt:S.v.vt,fio2:S.v.fio2,hs,vs,variant:W.variant,haloLast:S.snapHalo,ventLast:S.snapVent,
    staleAt:hs==='stale'?S.halo.since:null,att,prevAtt,staleV:hs==='stale'?{spo2:S.v.spo2,hr:S.v.hr}:null};
  const al=wAlarm();
  // 0 · the watch itself has no link: nothing it shows can be current — say so, and carry the last known alarm
  if(!W.link)return{...base,k:'link',lastAt:W.linkAt,lastAlarm:W.linkAlarm};
  // 1 · CRITICAL — overrides every page (overview, secondary, notice). Only details and the iPhone handoff are allowed, both keep alarm context.
  if(al){if(W.page==='detail')return{...base,k:'cdetail',al};if(W.page==='handoff')return{...base,k:'handoff',al};return{...base,k:'critical',al};}
  if(W.page==='handoff')return{...base,k:'handoff'};
  // AeroSync confirmed the alarm ended
  if(W.cleared&&Date.now()-W.cleared.at<6000)return{...base,k:'cleared',at:W.cleared.end};
  // 2 · ATTENTION — short look, then long look; only while HALO is live
  if(att&&W.short&&W.short.id===att.id)return{...base,k:'short'};
  if(att&&W.page==='notice')return{...base,k:'notice'};
  // 3 · DATA AVAILABILITY
  if(hs==='off'&&vs==='off')return{...base,k:'both',lastAt:S.snapHalo?S.snapHalo.at:null};
  if(W.page==='appear'||W.page==='apconf')return{...base,k:W.page};
  if(W.page==='more')return{...base,k:'more'};
  if(hs==='stale')return{...base,k:'delayed'};
  // 4 · NORMAL overview (carries attention / offline status in its chip)
  return{...base,k:'home'};}

function wSet(go){const W=S.w;W.page='home';W.short=null;
  if(go==='link'){if(!W.link){render();return;}W.link=false;W.linkAt=now();const al=wAlarm();W.linkAlarm=al?al.title:null;W.buzz=Date.now();W.buzzDone=false;render();return;}
  W.link=true;
  if(go==='normalA'||go==='normalB'){W.variant=go==='normalA'?'A':'B';W.cleared=null;setScenario('normal');render();return;}
  if(go==='more'){if(S.scenario!=='normal'||wAlarm())setScenario('normal');W.cleared=null;W.page='more';render();return;}
  if(go==='cleared'){if(!wAlarm())setScenario('pressure');wConfirmClear();return;}
  if(go==='sound_home'){W.cleared=null;setScenario('sound');W.short=null;W.page='home';render();return;}
  if(go==='pressure_detail'){W.cleared=null;setScenario('pressure');W.page='detail';render();return;}
  if(go==='halo_off_att'){W.cleared=null;if(S.scenario!=='sound')setScenario('sound');W.short=null;setScenario('halo_off');render();return;}
  W.cleared=null;setScenario(go);render();}
/* Alarm cleared only after AeroSync confirms: the watch keeps showing the alarm until the ventilator reports the condition ended. */
function wConfirmClear(){S.w.confirming=Date.now();render();setTimeout(()=>{S.w.confirming=0;if(wAlarm())setScenario('normal');render();},1500);}
function wDo(d,ds){const W=S.w;
  if(d==='notice'){W.page='notice';W.short=null;}
  else if(d==='detail')W.page='detail';
  else if(d==='alarm')W.page='home';                 // resolves to the Critical screen while the alarm is active
  else if(d==='more')W.page='more';
  else if(d==='appear')W.page='appear';
  else if(d==='apick'){const A=AP();const cur=A.dev.watch==='shared'?A.shared:A.dev.watch;if(cur!==ds.val){A.pending={dev:'watch',val:ds.val};W.page='apconf';}}
  else if(d==='apapply'){const A=AP();if(A.pending)apApply('watch',A.pending.val,ds.scope);W.page='more';}
  else if(d==='home'){W.page='home';W.short=null;W.cleared=null;}
  else if(d==='handoff'){W.prev=W.page;W.page='handoff';}
  else if(d==='back'){W.page=W.prev&&W.prev!=='handoff'?W.prev:'home';}
  else if(d==='crown'){W.page='home';W.short=null;W.cleared=null;}  // never escapes an alarm: 'home' still resolves to Critical
  else if(d==='go'){wSet(ds.g);return;}
  render();}
function wTick(){const W=S.w;let ch=false;
  if(W.short&&Date.now()-W.short.at>3500){W.page='notice';W.short=null;ch=true;}
  if(W.cleared&&Date.now()-W.cleared.at>6000&&W.cleared.shown!==2){W.cleared.shown=2;ch=true;}
  if(W.buzz&&Date.now()-W.buzz>900&&!W.buzzDone){W.buzzDone=true;ch=true;}
  return ch;}
/* Digital Crown simulation: wheel over the live watch scrolls; on the overview it pages down to the secondary screen, and back up at the top */
let wWheelAt=0;
document.addEventListener('wheel',e=>{const c=e.target.closest&&e.target.closest('.w-big-case');if(!c)return;e.preventDefault();
  const sc=c.querySelector('.w-scroll');const k=wLive().k;const t=Date.now();
  if((k==='home'||k==='delayed')&&e.deltaY>8&&t-wWheelAt>500){wWheelAt=t;S.w.page='more';render();return;}
  if(k==='more'&&sc&&sc.scrollTop<=0&&e.deltaY<-8&&t-wWheelAt>500){wWheelAt=t;S.w.page='home';render();return;}
  if(sc){sc.scrollTop+=e.deltaY*.6;if(e.deltaY)wWheelAt=t;}},{passive:false});

/* ---------- Remote settings (clinician portal → AeroSync) ----------
   A clinician can change ventilator settings and alarm limits from the portal. Safeguards:
   a reason is required, the caregiver must accept at the bedside before anything changes,
   requests expire, every change (remote or at the device) is logged, and bedside changes alert the portal. */
const RX_KEYS=['rr','vt','peep','ti','ps','fio2','rrHi','pipHi','vtLo','fio2Lo'];
const RX_REASONS=['Follow-up from today’s visit','Adjusting for recent readings','Weaning plan step','Correcting a setting','Other'];
function RX(){return S.rx||(S.rx={edit:null,reason:'',review:false,pending:null,log:[]});}
const rxVal=k=>k in S.vset?S.vset[k]:S.vlim[k];
function rxFmt(k,v){const sp=VSPEC[k];return(sp.dp?Number(v).toFixed(sp.dp):v)+(sp.u?' '+sp.u:'');}
function rxChanges(){const R=RX();return R.edit?RX_KEYS.filter(k=>R.edit[k]!==rxVal(k)).map(k=>({k,old:rxVal(k),nu:R.edit[k]})):[];}
function rxApply(changes){changes.forEach(c=>{if(c.k in S.vset)S.vset[c.k]=c.nu;else S.vlim[c.k]=c.nu;});vRecalc();vSync();}
function rxLog(src,changes,status,extra={}){RX().log.unshift({src,changes,status,at:now(),by:src==='remote'?'J. Rivera, RRT':'At the ventilator',reviewed:src==='remote',...extra});}
/* portal: settings card on the Devices page */
function rxCard(){const R=RX(),z=S.vset,L=S.vlim;const ed=!!R.edit;
  const row=(k,label)=>{const sp=VSPEC[k];const v=ed?R.edit[k]:rxVal(k);const ch=ed&&v!==rxVal(k);
    return ed?`<div class="cp-kv rx-e ${ch?'ch':''}"><span>${label}</span><span class="rx-step"><button data-act="cp" data-do="rxstep" data-k="${k}" data-d="-1" aria-label="Lower ${label}" ${v<=sp.min?'disabled':''}>−</button><b>${rxFmt(k,v)}</b><button data-act="cp" data-do="rxstep" data-k="${k}" data-d="1" aria-label="Raise ${label}" ${v>=sp.max?'disabled':''}>+</button></span>${ch?`<small>was ${rxFmt(k,rxVal(k))}</small>`:''}</div>`
      :`<div class="cp-kv"><span>${label}</span><b>${rxFmt(k,v)}</b></div>`;};
  const n=rxChanges().length;
  const head=R.pending?`<div class="rx-pend">${I('clock',16)}<div><b>Waiting for the caregiver to accept at the ventilator</b><small>Sent ${hm(R.pending.at)} · ${R.pending.changes.map(c=>VSPEC[c.k].n+' '+rxFmt(c.k,c.old)+' → '+rxFmt(c.k,c.nu)).join(' · ')} · nothing changes until they accept</small></div><button class="cp-chip" data-act="cp" data-do="rxcancel">Cancel request</button></div>`
    :ed?'':`<div class="rx-top"><span>Current settings on AeroSync</span><button class="cp-btn sm" data-act="cp" data-do="rxedit">${I('gauge',16)}Change settings</button></div>`;
  return`${head}<div class="cp-kvg"><div><h4>SETTINGS · Mode ${z.mode}</h4>${row('rr','Breathing rate')}${row('vt','Tidal volume')}${row('peep','PEEP')}${row('ti','Inspiratory time')}${row('ps','Pressure support')}${row('fio2','FiO₂')}</div>
   <div><h4>ALARM LIMITS</h4>${row('rrHi','RR high')}${row('pipHi','Peak pressure high')}${row('vtLo','Tidal volume low')}${row('fio2Lo','FiO₂ low')}${ed?'':`<h4 style="margin-top:14px">DEVICE</h4><div class="cp-kv"><span>Power</span><b>AC wall · battery 84%</b></div><div class="cp-kv"><span>Hours run</span><b>1,284 h</b></div>`}</div></div>
   ${ed?`<div class="rx-foot"><label><span>Reason for change <i>(required)</i></span><select data-cpin="rxreason"><option value="">Choose a reason…</option>${RX_REASONS.map(r=>`<option ${R.reason===r?'selected':''}>${r}</option>`).join('')}</select></label>
     <span class="rx-n">${n?`${n} change${n>1?'s':''}`:'No changes yet'}</span><button class="cp-chip" data-act="cp" data-do="rxclose">Cancel</button><button class="cp-btn" data-act="cp" data-do="rxreview" ${n&&R.reason?'':'disabled'}>Review change</button></div>`
     :`<p class="cp-fn">Changes made here need the caregiver to accept them at the ventilator before they take effect. Every change is logged.</p>`}
   ${R.review?rxReview():''}`;}
function rxReview(){const R=RX();const ch=rxChanges();
  return`<div class="rx-scrim"><div class="rx-dlg" role="dialog" aria-modal="true" aria-label="Review settings change"><h3>Send this change to Lila’s ventilator?</h3>
   <table class="rx-t"><tr><th>Setting</th><th>Now</th><th>New</th></tr>${ch.map(c=>`<tr><td>${VSPEC[c.k].n}</td><td>${rxFmt(c.k,c.old)}</td><td><b>${rxFmt(c.k,c.nu)}</b></td></tr>`).join('')}</table>
   <p><b>Reason:</b> ${R.reason}</p>
   <ul><li>AeroSync will ask the caregiver at the bedside to accept. <b>Nothing changes until they do.</b></li><li>If no one accepts within 10 minutes, the request expires.</li><li>The change is logged with your name and reason.</li></ul>
   <div class="rx-btns"><button class="cp-chip" data-act="cp" data-do="rxback">Back to editing</button><button class="cp-btn" data-act="cp" data-do="rxsend">Send to AeroSync</button></div></div></div>`;}
function rxAlert(){const R=RX();const u=R.log.find(l=>!l.reviewed);if(!u)return'';
  return`<div class="rx-alert">${I('tri',18)}<div><b>Ventilator settings changed at the bedside · ${hm(u.at)}</b><small>${u.changes.map(c=>VSPEC[c.k].n+' '+rxFmt(c.k,c.old)+' → '+rxFmt(c.k,c.nu)).join(' · ')}. Please check this was intended.</small></div><button class="cp-chip" data-act="cp" data-do="page" data-p="devices">View</button><button class="cp-btn sm" data-act="cp" data-do="rxack">Mark as reviewed</button></div>`;}
function rxHistory(){const R=RX();if(!R.log.length)return'';
  return`<section class="cp-card"><div class="cp-ch"><h3>${I('activity',18)} Settings history</h3></div>${R.log.slice(0,6).map(l=>`<div class="rx-h"><span class="rx-src ${l.src}">${l.src==='remote'?'Portal':'Bedside'}</span><div><b>${l.changes.map(c=>VSPEC[c.k].n+' '+rxFmt(c.k,c.old)+' → '+rxFmt(c.k,c.nu)).join(' · ')}</b><small>${hm(l.at)} · ${l.by}${l.reason?' · '+l.reason:''} · ${{applied:'Applied',declined:'Declined at the bedside',cancelled:'Cancelled',accepted:'Accepted at the bedside'}[l.status]||l.status}${!l.reviewed?' · <i>needs review</i>':''}</small></div></div>`).join('')}</section>`;}
function rxDo(d,ds){const R=RX();
  if(d==='rxedit'){R.edit={};RX_KEYS.forEach(k=>R.edit[k]=rxVal(k));R.reason='';R.review=false;}
  else if(d==='rxstep'){const sp=VSPEC[ds.k];let v=Math.round((R.edit[ds.k]+(+ds.d)*sp.step)*10)/10;R.edit[ds.k]=Math.min(sp.max,Math.max(sp.min,v));}
  else if(d==='rxclose'){R.edit=null;R.review=false;}
  else if(d==='rxreview'){if(rxChanges().length&&R.reason)R.review=true;}
  else if(d==='rxback'){R.review=false;}
  else if(d==='rxsend'){R.pending={changes:rxChanges(),reason:R.reason,at:now(),by:'J. Rivera, RRT'};R.edit=null;R.review=false;}
  else if(d==='rxcancel'){if(R.pending)rxLog('remote',R.pending.changes,'cancelled',{reason:R.pending.reason});R.pending=null;}
  else if(d==='rxack'){R.log.forEach(l=>l.reviewed=true);}
  render();}
/* AeroSync: the bedside request (shown only when no alarm is active and no other window is open) */
function rxVentModal(){const R=RX();const P=R.pending;if(!P)return'';
  return`<div class="v-mod"><div class="v-mb rx-vmb"><h3>Settings change from J. Rivera, RRT</h3><p>Sent from the clinician portal at ${hm(P.at)} · ${P.reason}</p>
   <div class="rx-vl">${P.changes.map(c=>`<div><span>${VSPEC[c.k].n}</span><b>${rxFmt(c.k,c.old)} → ${rxFmt(c.k,c.nu)}</b></div>`).join('')}</div>
   <p>Check on Lila, then accept to apply these settings now. Nothing changes if you decline.</p>
   <div class="v-mbtn">${VF('rxdecline','','Decline','sec')}${VF('rxaccept','','Accept and apply','pri')}</div></div></div>`;}
function rxVentDo(d){const R=RX();const P=R.pending;if(!P)return;
  if(d==='rxaccept'){rxApply(P.changes);rxLog('remote',P.changes,'accepted',{reason:P.reason});R.pending=null;render();vToast('New settings applied');}
  else{rxLog('remote',P.changes,'declined',{reason:P.reason});R.pending=null;render();vToast('Request declined · the clinician is notified');}}
/* simulate a change made at the device itself (for the portal alert) */
function rxBedsideSim(){const ch=[{k:'rr',old:S.vset.rr,nu:S.vset.rr+2}];rxApply(ch);rxLog('bedside',ch,'applied');render();}

/* ---------- AeroSync: detail view for a monitored value ----------
   Reached by touching a tile or turning the knob to it and pressing. Content follows what ventilator
   monitoring screens typically show: measured vs set, related derived values, alarm limits, a 1-hour trend with min/avg/max. */
const VM_ORDER=['rr','pip','vt','fio2'];
const VM_KG=12; // illustrative weight for ml/kg
function vmSeries(k){const v=S.v,base={rr:v.rr,pip:v.pip,vt:v.vt,fio2:v.fio2}[k];const n=60;let seed={rr:3,pip:7,vt:11,fio2:5}[k];
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};const amp={rr:1.6,pip:1.4,vt:5,fio2:.4}[k];
  const pe=active().find(e=>e.kind==='pressure');const out=[];
  for(let i=0;i<n;i++){let b=k==='pip'&&pe?18+Math.round((S.vset.vt-85)/10)+(S.vset.peep-5):k==='rr'&&pe?24+(S.vset.rr-24):k==='vt'&&pe?85+(S.vset.vt-85):base;
    let x=b+(rnd()-.5)*2*amp;if(pe&&i>=n-3)x=base;out.push(Math.round(x*10)/10);}
  out[n-1]=base;return out;}
function vmInfo(k){const v=S.v,z=S.vset,L=S.vlim;const per=60/Math.max(1,v.rr);const te=Math.max(.1,per-z.ti);const ie='1:'+(te/z.ti).toFixed(1);
  const mve=(v.rr*v.vt/1000).toFixed(2);const vti=v.vt+6;const leak=Math.round((vti-v.vt)/vti*100);
  const pmean=(z.peep+(v.pip-z.peep)*z.ti/per).toFixed(1);
  return{
   rr:{n:'Respiratory rate',u:'breaths/min',val:v.rr,set:`Set ${z.rr}`,lim:[VT.rr.lo,L.rrHi],tgt:[VT.rr.tlo,VT.rr.thi],
    rows:[['Set (mandatory) rate',z.rr+' /min'],['Spontaneous breaths',Math.max(0,v.rr-z.rr)+' /min'],['I:E ratio',ie],['Inspiratory time (Ti)',z.ti.toFixed(1)+' s'],['Expiratory time (Te)',te.toFixed(1)+' s'],['Minute ventilation',mve+' L/min']],
    note:'Measured total rate, including breaths Lila triggers herself.'},
   pip:{n:'Peak inspiratory pressure',u:'cmH₂O',val:v.pip,set:`Limit ${L.pipHi}`,lim:[0,L.pipHi],tgt:[VT.pip.tlo,VT.pip.thi],
    rows:[['Mean airway pressure',pmean+' cmH₂O'],['PEEP (set / measured)',`${z.peep} / ${(z.peep+.2).toFixed(1)} cmH₂O`],['Driving pressure (PIP − PEEP)',(v.pip-z.peep)+' cmH₂O'],['Pressure support',z.ps+' cmH₂O'],['High-pressure alarm',`> ${L.pipHi} cmH₂O`]],
    note:'A rise can mean secretions, a kinked circuit, coughing or a change in the lungs.'},
   vt:{n:'Tidal volume',u:'mL',val:v.vt,set:`Set ${z.vt}`,lim:[L.vtLo,VT.vt.hi],tgt:[VT.vt.tlo,VT.vt.thi],
    rows:[['Exhaled (VTE)',v.vt+' mL'],['Inspired (VTI)',vti+' mL'],['Leak',leak+'%'],['Per kg',(v.vt/VM_KG).toFixed(1)+` mL/kg (${VM_KG} kg)`],['Minute ventilation',mve+' L/min'],['Low-volume alarm',`< ${L.vtLo} mL`]],
    note:'Shows exhaled volume. A large gap between inspired and exhaled volume points to a leak at the trach or circuit.'},
   fio2:{n:'Oxygen (FiO₂)',u:'%',val:v.fio2,set:`Set ${z.fio2}`,lim:[L.fio2Lo,VT.fio2.hi||60],tgt:[VT.fio2.tlo||z.fio2-2,VT.fio2.thi||z.fio2+2],
    rows:[['Set FiO₂',z.fio2+'%'],['Measured FiO₂',v.fio2+'%'],['Low-oxygen alarm',`< ${L.fio2Lo}%`],['O₂ sensor','Calibrated today 8:00 AM'],['SpO₂ (from HALO)',S.halo.st==='live'?S.v.spo2+'%':'No HALO data']],
    note:'Measured by the oxygen sensor in the circuit. SpO₂ comes from Lila’s HALO sensor.'}}[k];}
function vMetric(k,V){const M=vmInfo(k);const s=vmSeries(k);const mn=Math.min(...s),mx=Math.max(...s),avg=(s.reduce((a,b)=>a+b,0)/s.length).toFixed(k==='fio2'||k==='rr'?0:0);
  const W=470,H=196;const lo=Math.min(mn,M.lim[0])*.95,hi=Math.max(mx,M.lim[1])*1.05;const y=x=>H-((x-lo)/(hi-lo))*H;const x=i=>i/(s.length-1)*W;
  const st=k==='pip'&&V.pipC?'crit':k==='vt'&&V.vtA||k==='rr'&&V.rrA?'att':'';
  const path=s.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p).toFixed(1)).join('');
  const idx=VM_ORDER.indexOf(k);
  return`<div class="vm ${st}">
   <div class="vm-l"><div class="vm-k">${M.n}</div><div class="vm-v">${M.val}<small>${M.u}</small></div><div class="vm-s">${st==='crit'?`${I('oct',18)} Above alarm limit`:st==='att'?`${I('tri',18)} Outside target`:`${I('check',18)} In limits`} · ${M.set}</div>
    <div class="vm-lim"><span>Alarm limits</span><b>${M.lim[0]} – ${M.lim[1]}</b><span>Target</span><b>${M.tgt[0]} – ${M.tgt[1]}</b></div><p>${M.note}</p></div>
   <div class="vm-c"><div class="vm-ch"><b>Last 60 min</b><span>Min ${mn} · Avg ${avg} · Max ${mx}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="vm-svg"><rect x="0" y="${y(M.tgt[1])}" width="${W}" height="${Math.max(0,y(M.tgt[0])-y(M.tgt[1]))}" fill="#1F3A3A"/>
     <line x1="0" x2="${W}" y1="${y(M.lim[1])}" y2="${y(M.lim[1])}" stroke="#F2756D" stroke-dasharray="6 5" stroke-width="1.5"/>${M.lim[0]>lo?`<line x1="0" x2="${W}" y1="${y(M.lim[0])}" y2="${y(M.lim[0])}" stroke="#F2756D" stroke-dasharray="6 5" stroke-width="1.5"/>`:''}
     <path d="${path}" fill="none" stroke="#4CC2AF" stroke-width="2.5"/><circle cx="${x(s.length-1)}" cy="${y(s[s.length-1])}" r="5" fill="#F2F0EB"/></svg>
    <div class="vm-ax"><span>${hm(new Date(+now()-3600000))}</span><span>Now</span></div></div>
   <div class="vm-r">${M.rows.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>
</div>`;}

let lastOrient=null;

function render(){const stage=document.getElementById('stage');
  if(S.view==='system'&&S.orient!=='landscape')S.orient='landscape';

  stage.innerHTML=`<div class="stage-label">${label} · ${fmtS(now())}</div>`+(S.view==='apnm'?`<div class="rig apnm" id="device">${apCompareHTML()}</div>`:S.view==='watch'?`<div class="rig w" id="device">${watchHTML()}</div>`:S.view==='clinic'?`<div class="rig c" id="device">${clinicHTML()}</div>`:S.view==='phone'?phone:S.view==='vent'?`<div class="rig v" id="device">${ventHTML()}</div>`:`<div class="rig s" id="device">${phone}<div class="cradle"></div>${ventHTML()}</div>`);
  stage.dataset.k=k;fit(full);
  if(same)[...stage.querySelectorAll('.scroll, .dd .col')].forEach((n,i)=>{if(keeps[i]!=null)n.scrollTop=keeps[i];});

function fit(full){const d=document.getElementById('device');if(!d)return;if(full){d.style.transform='';d.style.margin='';return;}

  const s=Math.min((st.clientWidth-32)/w,(st.clientHeight-56)/h,1.15);d.style.setProperty('--s',s);d.style.transform=`scale(${s})`;d.style.margin=`${(h*s-h)/2}px ${(w*s-w)/2}px`;}

function scApply(k){const [s,l]=k.split(':');if(l)S.lowLevel=l;S.stack=[{v:'home'}];setScenario(s);S.test=null;}
function scClick(e){const t=e.target.closest('button,[data-scclose]');if(!t)return;const D=t.dataset;
  if(D.scopen){scSheetOpen=!scSheetOpen;scBar();return;}
  if(D.scclose){scSheetOpen=false;scBar();return;}
  if(D.sctip){scLS.set('sc-tip-off','1');scBar();return;}
  if(D.scv){scGo(D.scv);return;}
  if(D.scstory!==undefined){if(D.scstory==='0'){scStory=null;scBar();return;}
    const s=SC_STORY.find(x=>x.k===D.scstory);scStory=s.k;scSheetOpen=false;scApply(s.k);scGo(s.go);return;}
  if(D.scs){scStory=null;scSheetOpen=false;scApply(D.scs);render();return;}
  if(D.scr){const v=S.view,o=S.orient;S=fresh();S.view=v;S.orient=o;scStory=null;scSheetOpen=false;scZoom(1);render();return;}
  if(D.scz!==undefined){const d=+D.scz;scZoom(d===0?1:SCZ.z*(d>0?1.5:1/1.5));return;}
  if(D.scimm){scImmersive(!scImm);return;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(scSheetOpen){scSheetOpen=false;scBar();}else if(scImm)scImmersive(false);}});

/* ---------- immersive full screen ---------- */
function scImmersive(on){scImm=on;const de=document.documentElement;
  try{if(on&&de.requestFullscreen&&!document.fullscreenElement)de.requestFullscreen().catch(()=>{});
      if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});}catch(_){}
  render();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&scImm){scImm=false;render();}});

/* ---------- fitting + zoom/pan viewer (replaces the bench's fit; interfaces untouched) ---------- */
const SCZ={k:null,z:1,x:0,y:0,max:4,info:null};
function scDims(){const v=S.view;
  if(v==='phone')return S.orient==='portrait'?[418,872]:[872,418];
  return {system:[1400,1130],vent:[1400,690],clinic:[1440,936],watch:[520,640],apnm:[1460,600]}[v]||[1400,680];}
fit=function(full){const d=document.getElementById('device');if(!d)return;
  if(full){d.style.cssText='';return;}
  const st=document.getElementById('stage'),W=st.clientWidth,H=st.clientHeight;const [w,h]=scDims();
  const m=scMobile(),wide=SC_WIDE.includes(S.view);const pad=scImm?6:(m?(wide?10:14):36);
  const cap=S.view==='phone'?1:S.view==='watch'?1.25:1.2;
  const s0=Math.max(.05,Math.min((W-pad*2)/w,(H-pad*2)/h,cap));
  if(SCZ.k!==S.view){SCZ.k=S.view;SCZ.z=1;SCZ.x=0;SCZ.y=0;}
  if(!wide){SCZ.z=1;SCZ.x=0;SCZ.y=0;}
  const s=s0*SCZ.z;scClampPan(W,H,w*s,h*s);
  const tx=(W-w*s)/2+SCZ.x,ty=(H-h*s)/2+SCZ.y;
  d.style.position='absolute';d.style.left='0';d.style.top='0';d.style.margin='0';d.style.transformOrigin='0 0';
  d.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;d.style.setProperty('--s',s);
  SCZ.info={W,H,w,h,s0,s,tx,ty};
  st.style.touchAction=wide?'none':'';};
function scClampPan(W,H,cw,ch){const mx=Math.max(0,(cw-W)/2+24),my=Math.max(0,(ch-H)/2+24);
  SCZ.x=Math.max(-mx,Math.min(mx,SCZ.x));SCZ.y=Math.max(-my,Math.min(my,SCZ.y));if(cw<=W)SCZ.x=0;if(ch<=H)SCZ.y=0;}
function scZoom(z,px,py){const I=SCZ.info;if(!I)return;z=Math.max(1,Math.min(SCZ.max,z));
  if(px==null){px=I.W/2;py=I.H/2;}
  const cx=(px-I.tx)/I.s,cy=(py-I.ty)/I.s,s2=I.s0*z;
  SCZ.z=z;SCZ.x=(px-cx*s2)-(I.W-I.w*s2)/2;SCZ.y=(py-cy*s2)-(I.H-I.h*s2)/2;
  fit(false);scBar();}
/* gestures on the stage: pinch / ctrl-wheel / double-tap zoom, drag to pan when zoomed */
(function(){const st=document.getElementById('stage');const P=new Map();let g=null,moved=false,lastTap=0,lastXY=[0,0];
  const on=()=>SC_WIDE.includes(S.view);
  const rel=e=>{const r=st.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  const noPan=t=>t.closest&&t.closest('.v-knob,input,select,textarea');
  const scroller=t=>{for(let n=t;n&&n!==st;n=n.parentElement){const cs=getComputedStyle(n);if(/(auto|scroll)/.test(cs.overflowY)&&n.scrollHeight>n.clientHeight+2)return n;}return null;};
  st.addEventListener('pointerdown',e=>{if(!on())return;P.set(e.pointerId,rel(e));moved=false;
    if(P.size===2){const [a,b]=[...P.values()];g={type:'pinch',d0:Math.hypot(a[0]-b[0],a[1]-b[1]),z0:SCZ.z,m0:[(a[0]+b[0])/2,(a[1]+b[1])/2],x0:SCZ.x,y0:SCZ.y};}
    else if(P.size===1&&!noPan(e.target)){g={type:'pan',p0:rel(e),x0:SCZ.x,y0:SCZ.y,sc:SCZ.z<=1.001&&e.pointerType!=='mouse'?scroller(e.target):null,st0:0};if(g.sc)g.st0=g.sc.scrollTop;}
  },true);
  st.addEventListener('pointermove',e=>{if(!on()||!P.has(e.pointerId)||!g)return;P.set(e.pointerId,rel(e));
    if(g.type==='pinch'&&P.size>=2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      moved=true;const I=SCZ.info;const z=Math.max(1,Math.min(SCZ.max,g.z0*d/g.d0));
      const s1=I.s0*g.z0,tx1=(I.W-I.w*s1)/2+g.x0,ty1=(I.H-I.h*s1)/2+g.y0,cx=(g.m0[0]-tx1)/s1,cy=(g.m0[1]-ty1)/s1,s2=I.s0*z;
      SCZ.z=z;SCZ.x=(m[0]-cx*s2)-(I.W-I.w*s2)/2;SCZ.y=(m[1]-cy*s2)-(I.H-I.h*s2)/2;fit(false);e.preventDefault();return;}
    if(g.type==='pan'){const p=rel(e),dx=p[0]-g.p0[0],dy=p[1]-g.p0[1];if(!moved&&Math.hypot(dx,dy)<7)return;
      if(SCZ.z>1.001){moved=true;SCZ.x=g.x0+dx;SCZ.y=g.y0+dy;fit(false);e.preventDefault();}
      else if(g.sc){moved=true;g.sc.scrollTop=g.st0-dy/(SCZ.info?SCZ.info.s:1);}}
  },true);
  const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);
    if(P.size===0){if(g&&g.type==='pinch'||moved)scBar();
      // double-tap to zoom (touch) on non-interactive areas
      if(!moved&&on()&&e.pointerType!=='mouse'&&!e.target.closest('button,[data-act],a,input,select,.v-knob')){const t=Date.now(),p=rel(e);
        if(t-lastTap<320&&Math.hypot(p[0]-lastXY[0],p[1]-lastXY[1])<40){scZoom(SCZ.z>1.4?1:2.2,p[0],p[1]);lastTap=0;}else{lastTap=t;lastXY=p;}}
      g=null;}
    else if(P.size===1&&g&&g.type==='pinch'){const p=[...P.values()][0];g={type:'pan',p0:p,x0:SCZ.x,y0:SCZ.y};}};
  st.addEventListener('pointerup',up,true);st.addEventListener('pointercancel',up,true);
  st.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  st.addEventListener('dblclick',e=>{if(!on()||e.target.closest('button,[data-act],a,input,select,.v-knob'))return;const p=rel(e);scZoom(SCZ.z>1.4?1:2.2,p[0],p[1]);});
  st.addEventListener('wheel',e=>{if(!on()||!e.ctrlKey)return;e.preventDefault();const p=rel(e);scZoom(SCZ.z*Math.exp(-e.deltaY*.01),p[0],p[1]);},{passive:false});
})();

/* ---------- shareable URLs: ?device=…&state=… (&scenario=…) ---------- */
const SC_DEV={phone:'phone',docked:'system',ventilator:'vent',watch:'watch',portal:'clinic'};
const SC_DEV_ALIAS={vent:'vent',system:'system',dock:'system',clinic:'clinic',clinician:'clinic',dashboard:'clinic',caregiver:'phone',app:'phone'};
const SC_ST={normal:'normal',secretions:'sound','low-spo2':'lowspo2:attention','high-pressure':'pressure','critical-low-spo2':'lowspo2:critical','two-alerts':'concurrent',
 'halo-offline':'halo_off','aerosync-offline':'vent_off','both-offline':'both_off',delayed:'stale',restored:'restored'};
const SC_ST_ALIAS={alarm:'pressure',critical:'pressure','ventilator-alarm':'pressure',warning:'lowspo2:attention',attention:'lowspo2:attention','oxygen-alert':'lowspo2:attention',oxygen:'lowspo2:attention'};
const SC_SCN={'normal-monitoring':'normal','oxygen-alert':'lowspo2:attention','ventilator-alarm':'pressure'};
const scSlug=(map,val)=>Object.keys(map).find(k=>map[k]===val);
const scRoute=()=>{const seg=location.pathname.split('/').filter(Boolean);return seg.length&&(SC_DEV[seg[0].toLowerCase()]||SC_DEV_ALIAS[seg[0].toLowerCase()])?seg:null;};
const scBase=()=>scRoute()?'/':location.pathname;
function scURL(){const p=new URLSearchParams();p.set('device',scSlug(SC_DEV,scView())||'phone');p.set('state',scSlug(SC_ST,scCur())||'normal');
  if(scStory)p.set('scenario',scSlug(SC_SCN,scStory));return scBase()+'?'+p.toString();}
function scSyncURL(){const u=scURL();if(u!==location.pathname+location.search){try{window.history.replaceState(null,'',u);}catch(_){}}}
function scFromURL(){let q;try{q=new URLSearchParams(location.search);}catch(_){return;}
  const seg=scRoute()||[];const scn=(q.get('scenario')||'').toLowerCase(),st=(q.get('state')||seg[1]||'').toLowerCase(),dv=(q.get('device')||seg[0]||'').toLowerCase();
  if(scn&&SC_SCN[scn]){const s=SC_STORY.find(x=>x.k===SC_SCN[scn]);scStory=s.k;scApply(s.k);if(!dv){scGo(s.go);return;}}
  else if(st){const k=SC_ST[st]||SC_ST_ALIAS[st];if(k)scApply(k);}
  const v=SC_DEV[dv]||SC_DEV_ALIAS[dv];scGo(v||'phone');}
async function scShare(btn){const url=location.origin&&location.origin!=='null'?location.origin+scURL():location.href;
  const done=t=>{btn.textContent=t;setTimeout(()=>{btn.textContent='Share this view';},1800);};
  try{if(navigator.share&&scMobile()){await navigator.share({title:'AeroSense interactive prototype',text:'Explore the AeroSense interfaces (simulated data).',url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(url);done('Link copied');return;}catch(_){}
  try{const ta=document.createElement('textarea');ta.value=url;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done('Link copied');}catch(_){done('Copy the address bar');}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-scshare]');if(b){e.preventDefault();scShare(b);}});

/* ---------- performance: the prototype re-renders every second for live values.
   Skip ticks while the tab is hidden, and refresh the heavy clinician portal at most every 15 s
   unless the visitor is interacting with it. ---------- */
let scUserAt=0,scPortalAt=0;
['pointerdown','keydown','wheel'].forEach(t=>document.addEventListener(t,()=>{scUserAt=Date.now();},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
/* iOS Safari: stop page-level pinch while gesturing inside the zoom viewer */
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>{if(SC_WIDE.includes(S.view)&&e.target.closest&&e.target.closest('#bench'))e.preventDefault();},{passive:false}));
{const _render=render;let lastKey='';
 render=function(){const now=Date.now(),key=S.view+'|'+scCur()+'|'+S.orient+'|'+S.pt.page;
  if(document.hidden&&key===lastKey)return;
  if(S.view==='clinic'&&key===lastKey&&now-scUserAt>1500&&now-scPortalAt<15000){scBar();return;}
  lastKey=key;if(S.view==='clinic')scPortalAt=now;
  _render();scBar();fit(S.view==='phone'&&isSmall()&&S.orient===vpOrient());scSyncURL();};}
window.__sc={url:()=>scURL(),sync:()=>scSyncURL()};
scFromURL();render();


window.__dbg={get S(){return S;}};
if(isSmall())S.orient=vpOrient();
render();
})();
</script>
