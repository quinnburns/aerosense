<style>
/* Layout: test bench — phone (portrait or docked landscape) left, researcher panel right; on phones the app goes full-bleed and the panel becomes a drawer.
   App palette = AeroSense Round 4/5 Figma tokens. Identity color (HALO teal, AeroSync slate) is kept separate from status color (ok / attention / critical / offline). */
:root{
  --bench:#E7E5DF; --bench-2:#DAD7CF; --bench-ink:#26323B; --bench-ink-2:#5B6670; --bench-line:#C9C5BB; --bench-hi:#FFF6D6; --bench-hi-line:#C9A227;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* portrait (light) */
  --bg:#F2F0EB; --card:#FFFFFF; --tile:#F6F5F1; --ink:#2F4554; --ink2:#5E7080; --ink3:#8A98A3; --line:#E4E1D9;
  --halo:#147585; --halo-bg:#DDEEF1;           /* HALO identity */
  --vent:#4A5E86; --vent-bg:#E3E8F2;           /* AeroSync identity */
  --ok:#2E8574; --ok-bg:#DCEFEA;
  --att:#8A5A12; --att-bg:#FBEFD9; --att-line:#E3A63B;
  --crit:#C4362F; --crit-d:#A92A23; --crit-bg:#FBE9E7;
  --off:#5E7080; --off-bg:#EAE8E3;
  /* docked (dark) */
  --d-bg:#1B2832; --d-card:#22313D; --d-card2:#2A3A47; --d-text:#F2F0EB; --d-t2:#B5C3CC; --d-t3:#8A98A3; --d-teal:#4CC2AF; --d-okbg:#1F3A3A;
  --d-red:#E5483F; --d-redt:#F2756D; --d-redcard:#3B2328; --d-redrow:#4A2A30; --d-amber:#E3A63B; --d-ambercard:#302A1F; --d-amberrow:#3A3326; --d-gray:#6B7884; --d-vent:#9DB0D6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bench:#14191D;--bench-2:#1D242A;--bench-ink:#E6E9EB;--bench-ink-2:#9AA6AE;--bench-line:#33404A;--bench-hi:#3A3214;--bench-hi-line:#C9A227;color-scheme:dark}}
:root[data-theme="dark"]{--bench:#14191D;--bench-2:#1D242A;--bench-ink:#E6E9EB;--bench-ink-2:#9AA6AE;--bench-line:#33404A;--bench-hi:#3A3214;--bench-hi-line:#C9A227;color-scheme:dark}
html,body{height:100%}
body{background:var(--bench);color:var(--bench-ink);font-family:var(--ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #3DBCD0;outline-offset:2px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage-label{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));font:600 12px/1.3 var(--mono);color:var(--bench-ink-2);letter-spacing:.04em}
.device{position:relative;background:#0B1116;border-radius:58px;padding:14px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);transform-origin:center center;flex:none}
.device.rot{animation:dock .45s ease}
@keyframes dock{from{transform:scale(var(--s)) rotate(90deg);opacity:.2}to{transform:scale(var(--s)) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.device.rot{animation:none}}
.screen{position:relative;overflow:hidden;border-radius:44px;display:flex;flex-direction:column}
.portrait .screen{width:390px;height:844px;background:var(--bg);color:var(--ink)}
.landscape .screen{width:844px;height:390px;background:var(--d-bg);color:var(--d-text)}
.full .stage{padding:0}
.full .device{padding:0;border-radius:0;background:none;box-shadow:none;width:100%;height:100%}
.full .screen{width:100%!important;height:100%!important;border-radius:0}
.full .sbar{display:none}
.full.portrait .screen{padding-top:env(safe-area-inset-top,0px)}
.full .stage-label{display:none}

/* ===== Researcher panel ===== */
.panel{background:var(--bench-2);border-left:1px solid var(--bench-line);overflow:auto;padding-block:18px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.p-head{display:flex;flex-direction:column;gap:4px;border:2px dashed var(--bench-line);border-radius:6px;padding:10px 12px;background:var(--bench)}
.p-head b{font:700 13px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.p-head span{font-size:12.5px;color:var(--bench-ink-2)}
.p-sec{display:flex;flex-direction:column;gap:8px}
.p-sec h3{margin:0;font:700 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bench-ink-2)}
.p-list{display:flex;flex-direction:column;gap:4px}
.p-btn{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--bench-line);border-radius:6px;background:var(--bench);font-size:13px;line-height:1.3;min-height:36px}
.p-btn small{font:500 11px var(--mono);color:var(--bench-ink-2);flex:none;width:22px}
.p-btn[aria-pressed="true"]{background:var(--bench-hi);border-color:var(--bench-hi-line);font-weight:600}
.p-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bench-line);border-radius:6px;overflow:hidden}
.p-seg button{padding:8px 6px;font-size:12.5px;text-align:center;background:var(--bench)}
.p-seg button[aria-pressed="true"]{background:var(--bench-hi);font-weight:600}
.p-seg button+button{border-left:1px solid var(--bench-line)}
.p-test{border:1px solid var(--bench-line);border-radius:6px;background:var(--bench);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.p-test[data-on="true"]{border-color:var(--bench-hi-line);background:var(--bench-hi)}
.p-test .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.p-test b{font-size:13px}
.p-test .go{font:600 12px var(--mono);padding:6px 10px;border-radius:5px;border:1px solid var(--bench-ink-2);flex:none}
.p-test p{margin:0;font-size:12.5px;line-height:1.4;color:var(--bench-ink-2)}
.p-test ul{margin:2px 0 0;padding-left:18px;font-size:12px;line-height:1.45;color:var(--bench-ink-2)}
.p-read{font:500 12px/1.6 var(--mono);color:var(--bench-ink-2);border-top:1px solid var(--bench-line);padding-top:8px}
.p-read b{color:var(--bench-ink)}
.p-reset{padding:10px;border-radius:6px;border:1px solid var(--bench-ink);font:700 13px var(--mono);text-align:center;letter-spacing:.04em}
.p-note{font-size:12px;line-height:1.45;color:var(--bench-ink-2);margin:0}
.p-chk{display:flex;gap:8px;align-items:center;font-size:13px}
.p-chk input{width:18px;height:18px}
.drawer-tab{display:none}
@media (max-width:900px){
  .bench{grid-template-columns:1fr}
  .panel{position:fixed;inset:0 0 0 auto;width:min(360px,92vw);z-index:50;transform:translateX(105%);transition:transform .25s ease;box-shadow:-20px 0 40px rgba(0,0,0,.25)}
  .panel.open{transform:none}
  .drawer-tab{display:block;position:fixed;z-index:40;left:0;top:50%;transform:translateY(-50%);width:18px;height:64px;border-radius:0 8px 8px 0;background:var(--bench-ink);color:var(--bench);font:700 10px var(--mono);writing-mode:vertical-rl;opacity:.35;padding-left:env(safe-area-inset-left,0px)}
  .drawer-close{display:block!important}
}
.drawer-close{display:none;align-self:flex-end;font:600 12px var(--mono);padding:6px 10px;border:1px solid var(--bench-line);border-radius:5px}

/* ===== App shared ===== */
.app{font-family:var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.sbar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:600;font-size:16px;flex:none;position:relative}
.sbar .isl{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:122px;height:34px;border-radius:20px;background:#0B1116}
.sbar .sys{display:flex;gap:5px;align-items:center}
.sbar .sys i{display:block;width:3px;background:currentColor;border-radius:1px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:4px 16px 28px;display:flex;flex-direction:column;gap:16px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

/* ===== Portrait components ===== */
.p h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.p h2{margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:-6px}
.backbtn{display:inline-flex;align-items:center;gap:2px;color:var(--halo);font-weight:600;font-size:16px;min-height:44px;min-width:44px;margin-left:-6px;padding-right:8px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font:700 11px/18px var(--ui);text-align:center;padding:0 4px}
.badge.amb{background:var(--att)}
.eyebrow{font:700 11.5px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}

/* status band — the page's one status-colored surface */
.band{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.band .bi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.band b{display:block;font-size:17px;line-height:1.25}
.band small{display:block;font-size:13.5px;line-height:1.4;margin-top:2px}
.band.ok{background:var(--ok-bg);color:#1E5C50} .band.ok .bi{background:#fff;color:var(--ok)}
.band.off{background:var(--off-bg);color:var(--ink)} .band.off .bi{background:#fff;color:var(--crit-d)}
.band.stale{background:var(--att-bg);color:#5E3E0B} .band.stale .bi{background:#fff;color:var(--att)}
.alarm{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.alarm.crit{background:var(--crit);color:#fff}
.alarm.att{background:var(--att-bg);box-shadow:inset 0 0 0 1.5px var(--att-line);color:var(--ink)}
.alarm .kick{font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.alarm.att .kick{color:var(--att)}
.alarm h2{font-size:23px;line-height:1.2}
.alarm p{margin:0;font-size:14.5px;line-height:1.4}
.alarm .also{font-size:13.5px;font-weight:600;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.16);line-height:1.35}
.alarm.att .also{background:rgba(138,90,18,.09)}
.alarm .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600}
.alarm .links span,.alarm .links button{display:inline-flex;gap:6px;align-items:center;min-height:32px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:700;font-size:16px;padding:0 18px;width:100%}
.btn.white{background:#fff;color:var(--crit-d)}
.btn.att{background:var(--att);color:#fff}
.btn.pri{background:var(--halo);color:#fff}
.btn.crit{background:var(--crit);color:#fff}
.btn.sec{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.btn.critout{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--crit);color:var(--crit-d)}
.btn[disabled]{opacity:.4;cursor:default}

/* device containers */
.dev{background:var(--card);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.dev-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.dev-h .id{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.dev.id-halo .id{background:var(--halo-bg);color:var(--halo)}
.dev.id-vent .id{background:var(--vent-bg);color:var(--vent)}
.dev-h .nm{flex:1;min-width:0}
.dev-h .nm b{display:block;font-size:16px}
.dev-h .nm small{display:block;font-size:12.5px;color:var(--ink2)}
.spill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.spill.live{background:var(--ok-bg);color:var(--ok)} .spill.stale{background:var(--att-bg);color:var(--att)} .spill.off{background:var(--crit-bg);color:var(--crit-d)}
.dev-b{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.dev-f{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:4px 14px 4px;font-size:12.5px;color:var(--ink2)}
.dev-f .meta{display:flex;gap:12px;align-items:center}
.dev-f .meta span{display:inline-flex;gap:4px;align-items:center}
.link{color:var(--halo);font-weight:700;font-size:14px;display:inline-flex;gap:2px;align-items:center;min-height:44px}
.dev.id-vent .link{color:var(--vent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--tile);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.tile .n{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.tile .n small{font-size:11.5px;color:var(--ink2);font-weight:500}
.tile .v{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.tile .v em{font-style:normal;font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:0}
.tile .s{font-size:12px;color:var(--ink2);font-weight:500;line-height:1.35;display:flex;gap:4px;align-items:center}
.tile.att{background:var(--att-bg);box-shadow:inset 0 0 0 1.5px var(--att-line)} .tile.att .v,.tile.att .s{color:var(--att)} .tile.att .s{font-weight:700}
.tile.crit{background:var(--crit-bg);box-shadow:inset 0 0 0 1.5px var(--crit)} .tile.crit .v,.tile.crit .s{color:var(--crit-d)} .tile.crit .s{font-weight:700}
.tile.na .v{color:var(--ink3);font-size:22px;padding:12px 0 6px;letter-spacing:0}
.tile.dim .v,.tile.dim .n{opacity:.45}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis.two{grid-template-columns:1fr 1fr}
.mini{background:var(--tile);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .k{font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center;font-weight:500}
.mini .val{font-size:15.5px;font-weight:700;line-height:1.25}
.mini .val small{font-size:11.5px;font-weight:500;color:var(--ink2)}
.mini.att{background:var(--att-bg);box-shadow:inset 0 0 0 1.5px var(--att-line)} .mini.att .val{color:var(--att)}
.mini.crit{background:var(--crit-bg);box-shadow:inset 0 0 0 1.5px var(--crit)} .mini.crit .val,.mini.crit .k{color:var(--crit-d)}
.mini.na .val{color:var(--ink3)} .mini.dim .val{opacity:.45}
.offnote{font-size:13px;line-height:1.4;font-weight:600;color:var(--crit-d);display:flex;gap:6px;align-items:flex-start}

.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:-8px}
.list{background:var(--card);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;width:100%;text-align:left;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-size:15px;line-height:1.3}
.row .t small{font-size:12.5px;color:var(--ink2);line-height:1.35}
.row .st{font-size:12.5px;font-weight:700;text-align:right;flex:none;line-height:1.3}
.row .chev{color:var(--ink3)}
.sev{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.sev.crit{background:var(--crit-bg);color:var(--crit-d)} .sev.att{background:var(--att-bg);color:var(--att)} .sev.off{background:var(--off-bg);color:var(--off)} .sev.done{background:var(--tile);color:var(--ink3)}
.st.crit{color:var(--crit-d)} .st.att{color:var(--att)} .st.done{color:var(--ink2);font-weight:600}
.note{font-size:12.5px;line-height:1.45;color:var(--ink2);margin:0}
/* priority coding */
.sev.low{background:var(--off-bg);color:var(--off)} .sev.past{opacity:.75}
.row.act-crit{background:#FDF1EF} .row.act-att{background:#FEF6E8} .row.act-low{background:#F6F5F1}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.prio{font:700 10.5px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:6px;white-space:nowrap}
.prio.crit{background:var(--crit-bg);color:var(--crit-d)} .prio.att{background:var(--att-bg);color:var(--att)} .prio.low{background:var(--off-bg);color:var(--off)}
.st.low{color:var(--off)}
.key{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);margin-top:-8px}
.key span{display:flex;gap:8px;align-items:center}
.kd{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none} .kd.crit{background:var(--crit)} .kd.att{background:var(--att-line)} .kd.low{background:var(--ink3)}
/* trends + reading page */
.cnts{display:flex;gap:6px;margin:10px 0 2px}
.rows{border-top:1px solid var(--line)}
.trow{gap:10px} .trow svg{flex:none}
.trow .now{font-size:15px;font-weight:700;min-width:46px;text-align:right}
.trow .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now.att{color:var(--att)} .now.crit{color:var(--crit-d)} .now.na{color:var(--ink3)}
.sumc.ok{color:var(--ok)!important;font-weight:600} .sumc.att{color:var(--att)!important;font-weight:600} .sumc.crit{color:var(--crit-d)!important;font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:center}

/* ===== AeroSense showcase shell (outer frame only) ===== */
html,body{height:100%}
body.sc{display:flex;flex-direction:column;background:#ECEFEE;overscroll-behavior:none}
body.sc .bench{flex:1;min-height:0;height:auto;grid-template-columns:minmax(0,1fr)!important;position:relative}
body.sc #panel,body.sc .drawer-tab,body.sc .stage-label{display:none!important}
body.sc .stage{padding:0!important;overflow:hidden}
/* watch: the live watch only (design gallery hidden) */
body.sc .w-gal,body.sc .w-cap,body.sc .w-hap{display:none!important}
body.sc .rig.w{width:520px!important;height:640px!important}
body.sc .w-stage{display:flex!important;justify-content:center;align-items:center;height:100%}
/* transitions */
@keyframes scIn{from{opacity:0}to{opacity:1}}
@keyframes scSt{from{opacity:.55}to{opacity:1}}
#stage.sc-in #device{animation:scIn .24s ease-out}
#stage.sc-st #device{animation:scSt .3s ease-out}
@media (prefers-reduced-motion:reduce){#stage.sc-in #device,#stage.sc-st #device{animation:none}}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
#scbar{flex:none;display:flex;align-items:center;gap:16px;background:#12303C;color:#FFFFFF;font-family:var(--ui);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));z-index:40;min-height:44px}
#scbar .brand{display:flex;flex-direction:column;line-height:1.15;flex:none;min-width:0}
#scbar .brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
#scbar .brand span{font-size:11.5px;color:#9DB4BE;white-space:nowrap}
#scbar .brand i{font-style:normal}
#scbar .brand em{font-style:normal;color:#CFE0E5}
#scbar .tabs{flex:1 1 auto;display:flex;justify-content:center;gap:4px;min-width:0}
#scbar .tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#B5C7CE;white-space:nowrap;transition:background .15s,color .15s}
#scbar .tab:hover{color:#FFFFFF;background:rgba(255,255,255,.07)}
#scbar .tab[aria-pressed="true"]{background:#FFFFFF;color:#12303C}
#scbar .sbtn{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.10);border-radius:12px;padding:7px 12px 7px 14px;min-height:30px;max-width:300px;transition:background .15s}
#scbar .sbtn:hover{background:rgba(255,255,255,.16)}
#scbar .sbtn i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
#scbar .sbtn span{display:flex;flex-direction:column;min-width:0;font-size:14px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scbar .sbtn small{font-size:10px;font-weight:700;letter-spacing:.09em;color:#9DB4BE;text-transform:uppercase}
#scbar .sbtn svg{flex:none;color:#C9D7DC}
#scbar button:focus-visible,#scnav button:focus-visible,#scsheet button:focus-visible,#sctools button:focus-visible,#scstory button:focus-visible{outline:2px solid #6FC7D6;outline-offset:2px}
@media (max-width:1020px){#scbar .tab span{display:none}#scbar .tab[aria-pressed="true"] span{display:inline}}
/* phone, upright: brand + state button; devices in the bottom bar */
#scbar.m{gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
#scbar.m .sbtn{flex:1;max-width:none;justify-content:flex-start;min-height:34px}
#scbar.m .sbtn svg{margin-left:auto}
/* phone, sideways: one slim row */
#scbar.m.land{padding:calc(4px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px));min-height:0}
#scbar.m.land .tabs{justify-content:flex-start;flex:0 0 auto}
#scbar.m.land .tab{padding:7px 10px;font-size:13px}
#scbar.m.land .tab span{display:none}#scbar.m.land .tab[aria-pressed="true"] span{display:inline}
#scbar.m.land .sbtn{flex:1;min-height:26px;padding:5px 12px}
#scbar.m.land .sbtn small{display:none}

/* ---------- bottom device bar (phones) ---------- */

 maint:[{id:'m1',t:'Swap HALO tie to set B',dev:'HALO',due:'Due tonight',soon:true,ic:'halo'},{id:'m2',t:'Change HME filter',dev:'AeroSync',due:'Due today',soon:true,ic:'vent'},{id:'m3',t:'Change ventilator circuit',dev:'AeroSync',due:'Due in 3 days',ic:'vent'},{id:'m4',t:'Charge HALO',dev:'HALO',due:'Battery 76% · below 20% in about 14 h',ic:'bat',auto:true}],sheet:null,test:null,reconnectMsg:null,scrollMem:{}};}
S=fresh();
const active=()=>S.events.filter(e=>!e.end);
const sevRank={critical:3,attention:2,conn:1,info:0};
const alerting=()=>active().filter(e=>e.level!=='info');
function overall(){const a=active();if(a.some(e=>e.level==='critical'))return'Critical';if(a.some(e=>e.level==='attention'))return'Attention';
  if(S.halo.st!=='live'||S.vent.st!=='live')return'Monitoring limited';return'Normal';}
function newEv(o){S.seq++;return Object.assign({id:'e'+S.seq,start:now(),end:null},o);}
function setScenario(name){
  const prevHaloOff=S.halo.st==='off', prevVentOff=S.vent.st==='off';
  const want={pressure:['pressure'],concurrent:['pressure','lowspo2'],lowspo2:['lowspo2'],sound:['sound'],halo_off:['halo_off'],vent_off:['vent_off'],both_off:['halo_off','vent_off']}[name]||[];
  const prevP=active().find(e=>e.kind==='pressure');const prevS=active().find(e=>e.kind==='sound');
  const lvl=name==='lowspo2'?S.lowLevel:'attention';
  for(const e of active()){const keep=(e.kind==='standby'&&S.vui.standby)||want.includes(e.kind)&&!(e.kind==='lowspo2'&&e.level!==lvl);if(!keep)e.end=now();}
  S.scenario=name;S.v={...SCEN[name].v};S.restored=null;S.reconnectMsg=null;
  if(name==='lowspo2'&&S.lowLevel==='critical'){S.v.spo2=84;S.v.hr=141;S.v.move='Moderate';}
  const n=now();
  S.halo={st:'live',since:null};S.vent={st:'live',since:null};
  const has=k=>active().some(e=>e.kind===k);let notify=null;
  if(name==='pressure'||name==='concurrent'){if(!has('pressure'))S.events.push(newEv({kind:'pressure',device:'AeroSync',level:'critical',peak:34}));notify=active().find(e=>e.kind==='pressure');}
  if(name==='concurrent'&&!has('lowspo2'))S.events.push(newEv({kind:'lowspo2',device:'HALO',level:'attention',value:89}));
  if(name==='lowspo2'&&!has('lowspo2')){S.events.push(newEv({kind:'lowspo2',device:'HALO',level:S.lowLevel,value:S.v.spo2}));}
  if(name==='lowspo2')notify=active().find(e=>e.kind==='lowspo2');
  if(name==='sound'){if(!has('sound'))S.events.push(newEv({kind:'sound',device:'HALO',level:'attention',reviewed:false}));notify=active().find(e=>e.kind==='sound');}
  if(name==='halo_off'){S.snapHalo={...S.v,at:new Date(n-4*60000)};S.halo={st:'off',since:S.snapHalo.at};S.lastOff='HALO';
    if(!has('halo_off'))S.events.push(newEv({kind:'halo_off',device:'HALO',level:'conn',start:S.snapHalo.at}));notify=active().find(e=>e.kind==='halo_off');}
  if(name==='vent_off'){S.snapVent={...S.v,at:new Date(n-2*60000)};S.vent={st:'off',since:S.snapVent.at};S.lastOff='AeroSync';
    if(!has('vent_off'))S.events.push(newEv({kind:'vent_off',device:'AeroSync',level:'conn',start:S.snapVent.at}));notify=active().find(e=>e.kind==='vent_off');}
  if(name==='both_off'){S.snapHalo={...S.v,at:new Date(n-4*60000)};S.snapVent={...S.v,at:new Date(n-4*60000)};S.halo={st:'off',since:S.snapHalo.at};S.vent={st:'off',since:S.snapVent.at};S.lastOff='HALO';
    if(!has('halo_off'))S.events.push(newEv({kind:'halo_off',device:'HALO',level:'conn',start:S.snapHalo.at}));if(!has('vent_off'))S.events.push(newEv({kind:'vent_off',device:'AeroSync',level:'conn',start:S.snapVent.at}));notify=active().find(e=>e.kind==='halo_off');}
  if(name==='stale'){S.halo={st:'stale',since:new Date(n-6*60000)};}
  if(name==='restored'){const dev=(prevVentOff&&!prevHaloOff)?'AeroSync':(prevHaloOff?'HALO':S.lastOff);
    const lastOffEv=[...S.events].reverse().find(e=>e.kind===(dev==='HALO'?'halo_off':'vent_off'));
    S.restored={dev,gapStart:lastOffEv?lastOffEv.start:new Date(n-5*60000),gapEnd:n};}
  if(prevP&&prevP.end&&S.w){S.w.cleared={at:Date.now(),end:prevP.end};S.w.page='home';}
  if(S.w){if(S.halo.st==='live')S.w.prevAtt=null;else if(prevS&&prevS.end)S.w.prevAtt={at:prevS.start};}
  if(S.w){const nw=active().find(e=>e.level==='critical')||active().find(e=>e.level==='attention');
    if(nw&&!S.w.seen[nw.id]){S.w.seen[nw.id]=1;S.w.buzz=Date.now();S.w.buzzDone=false;if(nw.level==='attention'){if(S.halo.st==='live')S.w.short={id:nw.id,at:Date.now()};S.w.page='home';}else{S.w.short=null;S.w.page='home';}}
    if(S.w.cleared&&Date.now()-S.w.cleared.at<100){S.w.buzz=Date.now();S.w.buzzDone=false;}}
  vRecalc();vSync();
  S.notif=(notify&&S.notifOn&&S.orient==='portrait'&&(notify.level==='critical'||(notify.level==='attention'&&S.prefs.att)||(notify.level==='conn'&&S.prefs.low)))?{ev:notify.id,at:Date.now()}:null;
}

/* ---------- event text ---------- */
function evText(e){const k=e.kind;
  if(k==='pressure')return{title:'High airway pressure',dev:'AeroSync',what:'Peak airway pressure is above the ventilator’s alarm limit. This alarm sounds and is managed at the ventilator.',meas:'Peak airway pressure',val:(e.peak||34)+' cmH₂O',thr:'Alarm limit '+TH.pipLimit+' cmH₂O',resp:'pressure'};
  if(k==='lowspo2'){const crit=e.level==='critical';return{title:'Low oxygen saturation',dev:'HALO',what:crit?'HALO SpO₂ is below Lila’s critical threshold.':'HALO SpO₂ went below Lila’s set range.',meas:crit?'SpO₂':'Lowest SpO₂',val:(e.value||90)+'%',thr:crit?'Critical below '+TH.spo2Crit+'%':'Set range '+TH.spo2Lo+'–100%',resp:'lowspo2'};}
  if(k==='sound')return{title:'Possible secretions in trach',dev:'HALO',what:'HALO heard a change in the airflow sound at Lila’s trach. This pattern often means secretions are building up, so suctioning may be needed. Check on Lila to confirm.',meas:'Airway sound',val:'Pattern like secretions',thr:'Concept sensing · confirm by checking Lila',resp:'sound'};
  if(k==='standby')return{title:'Ventilation off',dev:'AeroSync',what:'Ventilation was turned off at the ventilator. AeroSync is not ventilating Lila. Bag her or restart it at the ventilator.',meas:'Ventilation',val:'Stopped',thr:'—',resp:null};
  if(k==='halo_off')return{title:'HALO disconnected',dev:'HALO',what:'This phone stopped receiving HALO data. Oxygen, pulse, skin temperature, movement and airway readings can’t be shown.',meas:'Readings affected',val:'All HALO readings',thr:'—',resp:null};
  if(k==='vent_off')return{title:'AeroSync connection lost',dev:'AeroSync',what:'This phone stopped receiving ventilator data. The ventilator keeps running and alarming on its own.',meas:'Readings affected',val:'All AeroSync readings + alarm status',thr:'—',resp:null};
  return{title:'Event',dev:e.device,what:'',meas:'',val:'',thr:'',resp:null};}
const overlaps=(a,b)=>{const ae=a.end||now(),be=b.end||now();return a.start<=be&&b.start<=ae;};
const concurrentOf=e=>S.events.filter(x=>x!==e&&x.device!==e.device&&overlaps(x,e)&&x.level!=='info');
const spo2Tone=v=>v==null?'':v<TH.spo2Crit?'crit':v<TH.spo2Lo?'att':'';
let jit=0;
function jitter(){jit++;if(jit%4)return;const sc=SCEN[S.scenario].v;
  if(S.halo.st==='live'){const base=(S.scenario==='lowspo2'&&S.lowLevel==='critical')?84:sc.spo2;
    const cand=base+[0,0,1,-1][Math.floor(Math.random()*4)];if(spo2Tone(cand)===spo2Tone(base)&&cand<=100&&cand!==TH.spo2Crit)S.v.spo2=cand;
    const hb=(S.scenario==='lowspo2'&&S.lowLevel==='critical')?141:sc.hr;S.v.hr=Math.min(hb+Math.round(Math.random()*4-2),hb>TH.hrHi?160:TH.hrHi);}
  const lv=active().find(e=>e.kind==='lowspo2');if(lv&&S.halo.st==='live')lv.value=Math.min(lv.value,S.v.spo2);}

/* ---------- navigation ---------- */
const cur=()=>S.stack[S.stack.length-1];
const rootTab=()=>{const r=S.stack[0].v;return['home','trends','alerts','devices','more'].includes(r)?r:'home';};
function go(v,extra={}){saveScroll();S.stack.push(Object.assign({v},extra));S.point=null;render();scrollTop();}
function tab(v){saveScroll();S.stack=[{v}];S.point=null;S.sheet=null;render();scrollTop();}
function back(){saveScroll();if(S.stack.length>1)S.stack.pop();else S.stack=[{v:'home'}];S.point=null;render();restoreScroll();}
function key(){return S.orient+':'+S.stack.map(x=>x.v+(x.id||'')+(x.r||'')+(x.m||'')).join('/');}
function saveScroll(){const sc=document.querySelector('.screen .scroll');if(sc)S.scrollMem[key()]=sc.scrollTop;}
function restoreScroll(){const sc=document.querySelector('.screen .scroll');if(sc)sc.scrollTop=S.scrollMem[key()]||0;}
function scrollTop(){document.querySelectorAll('.screen .scroll, .dd .col').forEach(s=>s.scrollTop=0);}

/* ---------- portrait shell ---------- */
function sbar(){const d=now();let h=d.getHours()%12||12;return`<div class="sbar"><span>${h}:${String(d.getMinutes()).padStart(2,'0')}</span><span class="isl"></span><span class="sys"><i style="height:5px"></i><i style="height:8px"></i><i style="height:11px"></i><i style="height:14px"></i><svg width="24" height="12" viewBox="0 0 24 12" style="margin-left:4px"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/></svg></span></div>`;}
function tabbar(){const act=rootTab();const n=alerting().length;const crit=alerting().some(e=>e.level==='critical');
  const t=(v,ic,l)=>`<button class="tab" data-act="tab" data-v="${v}" ${act===v?'aria-current="page"':''}><span class="pill">${I(ic,22)}${v==='alerts'&&n?`<span class="badge ${crit?'':'amb'}">${n}</span>`:''}</span>${l}</button>`;
  return`<nav class="tabbar" aria-label="Main">${t('home','home','Home')}${t('trends','trends','Trends')}${t('alerts','bell','Alerts')}${t('devices','devices','Devices')}${t('more','more','More')}<span class="homeind"></span></nav>`;}
const backBtn=()=>`<div class="topbar"><button class="backbtn" data-act="back">${I('back',22)}Back</button></div>`;
function shell(inner){
  const n=S.notif?S.events.find(e=>e.id===S.notif.ev):null;const nt=n&&evText(n);
  const notif=n&&!n.end?`<button class="notif ${S.notif.shown?'':'in'}" data-act="notif" data-id="${n.id}"><span class="app-i">${I(n.level==='critical'?'oct':n.level==='conn'?'offline':'tri',18)}</span><span><b>AeroSense · ${n.level==='critical'?'Critical':n.level==='conn'?'Monitoring':'Attention'}</b><small>${esc(nt.title)} · ${nt.dev} · ${fmt(n.start)}</small></span><span class="when">now</span></button>`:'';
  return`<div class="screen app p">${sbar()}${notif}<div class="scroll">${inner}</div>${tabbar()}${sheetHTML()}</div>`;}
const pill=st=>st==='live'?`<span class="spill live"><i class="dot"></i>Live</span>`:st==='stale'?`<span class="spill stale">${I('clock',13)}Delayed</span>`:`<span class="spill off">${I('offline',13)}Not connected</span>`;

/* ---------- home ---------- */
function statusTop(){
  const a=active().sort((x,y)=>sevRank[y.level]-sevRank[x.level]);
  const crit=a.find(e=>e.level==='critical'),att=a.find(e=>e.level==='attention'),off=a.find(e=>e.level==='conn');
  if(crit&&crit.kind==='standby')return`<section class="alarm crit" aria-live="assertive"><div class="kick">${I('oct',16)}High priority · AeroSync · since ${fmt(crit.start)}</div><h2>Ventilation off</h2><p>Ventilation was turned off at the ventilator. Go to Lila now: bag her or restart AeroSync.</p>
     <button class="btn white" data-act="go" data-v="step" data-r="pressure" data-step="5" data-id="${crit.id}">${I('plan',18)}Open bagging steps${I('chev',16)}</button>
     <div class="links"><span>${I('vent',14)}Restart: hold ⏻ on the ventilator 3 s</span><button data-act="detail" data-id="${crit.id}">Alert details${I('chev',14)}</button></div></section>`;
  if(crit){const t=evText(crit);const low=a.find(e=>e.kind==='lowspo2'&&e!==crit);
    const also=crit.kind==='pressure'
      ?(S.halo.st==='off'?'HALO is not connected — the ventilator alarm still applies.':low?`At the same time, HALO SpO₂ is ${S.v.spo2}% — below Lila’s set range. Shown together, not as cause and effect.`:`HALO: SpO₂ ${S.v.spo2}%, pulse ${S.v.hr} — within set ranges. The alarm still applies.`)
      :`AeroSync: ${S.vent.st==='off'?'not connected — check the ventilator':'no active alarm'}.`;
    return`<section class="alarm crit" aria-live="assertive"><div class="kick">${I('oct',16)}High priority · ${t.dev} · since ${fmt(crit.start)}</div><h2>${t.title}</h2>
     <p>${crit.kind==='pressure'?'The ventilator is alarming. Go to Lila and the ventilator now.':`HALO SpO₂ is ${S.v.spo2}%, below Lila’s critical threshold (${TH.spo2Crit}%). Go to Lila now.`}</p><div class="also">${also}</div>
     <button class="btn white" data-act="resp" data-r="${t.resp}" data-id="${crit.id}">${I('plan',18)}Open emergency response${I('chev',16)}</button>
     <div class="links">${crit.kind==='pressure'?`<span>${I('mute',14)}Silence only at the ventilator</span>`:'<span></span>'}<button data-act="detail" data-id="${crit.id}">Alert details${I('chev',14)}</button></div></section>`;}
  if(att){const t=evText(att);
    const body=att.kind==='sound'?`HALO heard a sound pattern at Lila’s trach that often means secretions. Suctioning may be needed. Her movement is up too (${S.v.move.toLowerCase()}). No ventilator alarm.`:`HALO SpO₂ is ${S.v.spo2}% — below Lila’s set range (${TH.spo2Lo}–100). There is no ventilator alarm, but that doesn’t mean Lila is okay. Check on her.`;
    return`<section class="alarm att" aria-live="polite"><div class="kick">${I('tri',16)}Medium priority · HALO · since ${fmt(att.start)}</div><h2>${t.title}</h2><p>${body}</p>
     <button class="btn att" data-act="detail" data-id="${att.id}">See what changed${I('chev',16)}</button>
     ${att.kind==='sound'?'<p class="note" style="color:var(--att)">Concept sensing — confirm by checking Lila.</p>':''}</section>`;}
  if(off)return`<button class="band off" data-act="detail" data-id="${off.id}"><span class="bi">${I('offline',18)}</span><span style="flex:1"><b>${off.kind==='halo_off'?'HALO monitoring unavailable':'AeroSync not connected to this phone'}</b><small>${off.kind==='halo_off'?'Lila’s HALO readings can’t be shown. Check on her directly.':'The ventilator keeps running and alarming on its own. Check its screen.'}</small></span>${I('chev',16,'align-self:center;opacity:.6')}</button>`;
  if(S.halo.st==='stale')return`<button class="band stale" data-act="go" data-v="device" data-id="halo"><span class="bi">${I('clock',18)}</span><span style="flex:1"><b>HALO readings are delayed</b><small>Last update ${hm(S.halo.since)}. Dimmed values may not reflect Lila right now.</small></span>${I('chev',16,'align-self:center;opacity:.6')}</button>`;
  if(S.restored)return`<section class="band ok"><span class="bi">${I('check',18)}</span><span><b>${S.restored.dev} reconnected</b><small>Live again. No ${S.restored.dev} data from ${hm(S.restored.gapStart)} to ${hm(S.restored.gapEnd)}.</small></span></section>`;
  return`<section class="band ok"><span class="bi">${I('check',18)}</span><span><b>Lila is within her set ranges</b><small>No active alerts</small></span></section>`;}

function haloBlock(){const hs=S.halo.st,snap=S.snapHalo,off=hs==='off',stale=hs==='stale';
  const sp=off?null:S.v.spo2,hr=off?null:S.v.hr;const tone=off?'':spo2Tone(sp);const hrT=!off&&(hr>TH.hrHi||hr<TH.hrLo)?'att':'';

    <button class="tile ${tc(tone)}" data-act="metric" data-m="spo2"><span class="n">${I('o2',17)}Oxygen<small>SpO₂</small></span><span class="v">${off?'No data':sp+'<em>%</em>'}</span><span class="s">${off?`Last ${snap.spo2}% at ${hm(snap.at)}`:tone==='crit'?I('chevd',13)+'Critical below '+TH.spo2Crit:tone==='att'?I('chevd',13)+'Below set 92–100':'Set 92–100'}</span></button>
    <button class="tile ${tc(hrT)}" data-act="metric" data-m="hr"><span class="n">${I('heart',17)}Pulse</span><span class="v">${off?'No data':hr+'<em>bpm</em>'}</span><span class="s">${off?`Last ${snap.hr} at ${hm(snap.at)}`:hrT?'Above set 80–140':'Set 80–140'}</span></button></div>
    <div class="minis"><button class="mini ${off?'na':stale?'dim':''}" data-act="metric" data-m="temp"><span class="k">${I('thermo',14)}Skin temp</span><span class="val">${off?'No data':S.v.temp.toFixed(1)+' °C'}</span></button>
     <button class="mini ${off?'na':stale?'dim':''}" data-act="metric" data-m="move"><span class="k">${I('move',14)}Movement</span><span class="val">${off?'No data':S.v.move}</span></button>
     <button class="mini ${off?'na':stale?'dim':soundAct?'att':''}" data-act="metric" data-m="airway"><span class="k">${I('sound',14)}Airway</span><span class="val">${off?'No data':soundAct?'Secretions?':'Clear'}</span></button></div></div>
   <div class="dev-f"><span class="meta"><span>${I('bat',15)}76%</span></span><button class="link" data-act="go" data-v="device" data-id="halo">HALO details${I('chev',15)}</button></div></section>`;}

   <div class="dev-b"><button class="tile ${off?'na':''}" data-act="metric" data-m="rr" style="flex-direction:row;justify-content:space-between;align-items:flex-end"><span style="display:flex;flex-direction:column;gap:2px"><span class="n">${I('lungs',17)}Breathing rate (RR)</span><span class="v" style="font-size:${off?22:34}px">${off?'No data':S.v.rr+'<em>/min</em>'}</span></span><span class="s" style="padding-bottom:6px">${off?`Last ${snap.rr} at ${hm(snap.at)}`:'Set 20–30'}</span></button>

     <button class="mini ${off?'na':vtA?'att':''}" data-act="metric" data-m="vt"><span class="k">${I('lungs',14)}Air per breath (VTe)</span><span class="val">${off?'No data':(vtA?'▼ ':'')+S.v.vt+' <small>mL'+(vtA?' · set ≥70':'')+'</small>'}</span></button></div></div>

/* ---------- alerts ---------- */
const PRI={critical:{l:'High',c:'crit',ic:'oct'},attention:{l:'Medium',c:'att',ic:'tri'},conn:{l:'Low',c:'low',ic:'offline'}};
function evRow(e){const t=evText(e);const act=!e.end;const p=PRI[e.level]||PRI.conn;
  const st=act?`<span class="st ${p.c}">${e.level==='conn'?'Offline':'Active'}</span>`:`<span class="st done">${e.kind==='sound'?'Cleared':e.level==='conn'?'Reconnected':'Ended'}</span>`;
  const sub=e.kind==='pressure'?`AeroSync · ${fmt(e.start)} · ${e.peak} cmH₂O`:e.kind==='lowspo2'?`HALO · ${fmt(e.start)} · ${e.value}%`:`${t.dev} · ${fmt(e.start)}${e.end?' · '+dur(e.start,e.end):''}`;
  const conc=concurrentOf(e);const cs=conc.length?`Same time as ${evText(conc[0]).title.toLowerCase()}${conc.length>1?' + '+(conc.length-1)+' more':''}`:'';
  return`<button class="row ${act?'act-'+p.c:''}" data-act="detail" data-id="${e.id}"><span class="sev ${p.c} ${act?'':'past'}">${I(p.ic,17)}</span><span class="t"><b>${t.title}</b><small>${sub}</small>${cs?`<small style="font-weight:600;color:var(--ink)">${cs}</small>`:''}</span><span class="rcol"><span class="prio ${p.c}">${p.l}</span>${st}</span><span class="chev">${I('chev',16)}</span></button>`;}
function alertsView(){
  const a=active().sort((x,y)=>sevRank[y.level]-sevRank[x.level]);

  const groups=[['Today',hist.filter(e=>sameDay(e.start,n))],['Yesterday',hist.filter(e=>sameDay(e.start,y))],['Earlier this week',hist.filter(e=>!sameDay(e.start,n)&&!sameDay(e.start,y))]].filter(g=>g[1].length);
  const crit=a.find(e=>e.level==='critical');
  const html=`<div class="pad"><div class="hdr" style="margin-top:6px"><h1>Alerts</h1><button class="infob" data-act="sheet" data-s="prio" aria-label="What the alert colors mean">${I('info',22)}</button></div>
  ${a.length?`<div class="sec-h"><span class="eyebrow">Active now · ${a.length}</span></div><div class="list">${a.map(evRow).join('')}</div>
    ${crit&&evText(crit).resp?`<button class="btn crit" data-act="resp" data-r="${evText(crit).resp}" data-id="${crit.id}">${I('plan',18)}Open emergency response${I('chev',16)}</button>`:''}`
   :`<section class="band ok"><span class="bi">${I('check',18)}</span><span><b>No active alerts</b><small>Earlier alerts are below</small></span></section>`}
  ${groups.map(([h,l])=>`<div class="sec-h"><span class="eyebrow">${h}</span></div><div class="list">${l.map(evRow).join('')}</div>`).join('')}
  <p class="note">Ventilator alarms are silenced and reset only at the ventilator. They sound there whether or not this phone is connected.</p></div>`;
  return shell(html);}

/* ---------- alert detail ---------- */
function readingsNow(){const hs=S.halo.st,vs=S.vent.st;
  const r=(k,v,c='')=>`<div><dt>${k}</dt><dd class="${c}">${v}</dd></div>`;
  return`<div class="sec-h"><span class="eyebrow">Readings now</span></div>
  <section class="dev id-halo"><div class="dev-h"><span class="id">${I('halo',18)}</span><span class="nm"><b>HALO</b></span>${pill(hs)}</div><dl class="facts" style="border-top:1px solid var(--line)">
   ${r('Oxygen (SpO₂)',hs==='off'?'––':S.v.spo2+'%',hs!=='off'?spo2Tone(S.v.spo2):'')}${r('Pulse',hs==='off'?'––':S.v.hr+' bpm',hs!=='off'&&S.v.hr>TH.hrHi?'att':'')}${r('Skin temperature',hs==='off'?'––':S.v.temp.toFixed(1)+' °C')}</dl></section>
  <section class="dev id-vent"><div class="dev-h"><span class="id">${I('vent',18)}</span><span class="nm"><b>AeroSync</b></span>${pill(vs)}</div><dl class="facts" style="border-top:1px solid var(--line)">
   ${r('Breathing rate (RR)',vs==='off'?'––':S.v.rr+' /min')}${r('Peak pressure (PIP)',vs==='off'?'––':(S.v.pip>TH.pipLimit?'▲ ':'')+S.v.pip+' cmH₂O',vs!=='off'&&S.v.pip>TH.pipLimit?'crit':'')}${r('Air per breath (VTe)',vs==='off'?'––':(S.v.vt<TH.vtLo?'▼ ':'')+S.v.vt+' mL',vs!=='off'&&S.v.vt<TH.vtLo?'att':'')}</dl></section>`;}
function detailView(id){const e=S.events.find(x=>x.id===id);if(!e)return alertsView();
  const t=evText(e),act=!e.end,conc=concurrentOf(e),other=e.device==='HALO'?'AeroSync':'HALO';
  const chip=e.level==='critical'?`<span class="chip crit">${I('oct',13)}Critical · ${t.dev}</span>`:e.level==='conn'?`<span class="chip off">${I('offline',13)}Connection · ${t.dev}</span>`:`<span class="chip att">${I('tri',13)}Attention · ${t.dev}</span>`;
  const status=act?`<span class="statusline ${e.level==='attention'?'onA':'on'}"><i class="dot"></i>${e.level==='conn'?'Not connected':'Active'} since ${fmt(e.start)}</span>`:`<span class="statusline done">${I('check',16)}${e.kind==='sound'?'Cleared':e.level==='conn'?'Reconnected':'Ended'} ${fmt(e.end)} · lasted ${dur(e.start,e.end)}</span>`;
  const concHTML=conc.length?conc.map(c=>{const ct=evText(c);return`<button class="row" data-act="detail" data-id="${c.id}"><span class="sev ${c.end?'done':c.level==='critical'?'crit':c.level==='conn'?'off':'att'}">${I(c.level==='critical'?'oct':c.level==='conn'?'offline':'tri',17)}</span><span class="t"><b>${ct.title}</b><small>${c.device} · ${fmt(c.start)}${c.end?' – '+hm(c.end):' · active'}</small></span><span class="chev">${I('chev',16)}</span></button>`}).join('')
   :`<div class="row"><span class="sev done">${I('check',17)}</span><span class="t"><b>${e.device==='HALO'?(S.vent.st==='off'&&act?'AeroSync status unavailable':'No ventilator alarm at the same time'):(S.halo.st==='off'&&act?'HALO not connected':'Nothing unusual from HALO')}</b><small>${e.device==='HALO'?'No ventilator alarm doesn’t mean Lila is okay.':'The alarm still applies — the two devices don’t need to agree.'}</small></span></div>`;
  const respBtn=t.resp&&act?(e.level==='critical'?`<button class="btn crit" data-act="resp" data-r="${t.resp}" data-id="${e.id}">${I('plan',18)}Open emergency response${I('chev',16)}</button>`:`<button class="btn pri" data-act="resp" data-r="${t.resp}" data-id="${e.id}">${I('plan',18)}${RESP[t.resp]&&RESP[t.resp].status==='draft'?'Open response':'Open Lila’s care plan'}${I('chev',16)}</button>`)
   :!t.resp?`<button class="btn sec" data-act="go" data-v="device" data-id="${e.device==='HALO'?'halo':'vent'}">${e.device} status${I('chev',16)}</button>`:'';
  const html=`<div class="pad">${backBtn()}${chip}<h2 class="ttl">${t.title}</h2>${status}<p class="lead">${t.what}</p>
  ${respBtn}
  ${e.kind==='pressure'&&act?`<p class="note" style="display:flex;gap:6px;align-items:center">${I('mute',15)}Silence or reset this alarm at the ventilator. This phone can’t.</p>`:''}
  <div class="sec-h"><span class="eyebrow">What was detected</span></div>
  <dl class="list facts"><div><dt>Detected by</dt><dd>${t.dev==='HALO'?'HALO':'AeroSync ventilator'}</dd></div><div><dt>Started</dt><dd>${fmt(e.start)}</dd></div>
   <div><dt>${t.meas}</dt><dd class="${e.level==='critical'?'crit':e.level==='attention'?'att':''}">${t.val}</dd></div><div><dt>Threshold</dt><dd>${t.thr}</dd></div>
   ${e.kind==='sound'&&act?`<div><dt>Movement now</dt><dd class="${S.v.move!=='Low'?'att':''}">${S.v.move}${S.v.move!=='Low'?' · up from low':''}</dd></div><div><dt>SpO₂ now</dt><dd>${S.halo.st==='off'?'—':S.v.spo2+'%'+(S.v.spo2>=TH.spo2Lo?' · in range':' · below range')}</dd></div>`:''}${e.kind==='sound'?`<div><dt>Your review</dt><dd>${e.reviewed?'Reviewed':'Not yet reviewed'}</dd></div>`:''}</dl>
  <div class="sec-h"><span class="eyebrow">At the same time · ${other}</span></div><div class="list">${concHTML}</div>
  ${conc.length?'<p class="note" style="margin-top:-6px">Shown together because they happened at the same time — not as cause and effect.</p>':''}
  ${act?readingsNow():''}
  ${e.kind==='sound'&&act?`<button class="btn sec" data-act="review" data-id="${e.id}">${I('check',16)}${e.reviewed?'Reviewed · undo':'Mark as reviewed'}</button><p class="note">Reviewing keeps the alert open until HALO hears a clear airway again. HALO airway sensing is a concept.</p>`:''}
  <p class="note">Simulated data — not clinical measurements.</p></div>`;
  return shell(html);}

/* ---------- care plan ---------- */
function respCtx(id){const e=id&&S.events.find(x=>x.id===id);if(!e)return'';const t=evText(e);
  if(e.end)return`<div class="ctx ok"><b>${I('check',16)}${t.title} · ended ${hm(e.end)}</b><small>Opened from this alert. Keep watching Lila.</small></div>`;
  if(e.level==='critical')return`<div class="ctx crit"><b>${I('oct',16)}${t.title} · active</b><small>${t.dev} · since ${fmt(e.start)}${e.kind==='pressure'?' · silence only at the ventilator':''}</small></div>`;
  return`<div class="ctx att"><b>${I('tri',16)}${t.title} · active</b><small>${t.dev} · since ${fmt(e.start)}</small></div>`;}
function careplanView(){const c=cur();
  const html=`<div class="pad">${S.stack.length>1?backBtn():''}<h1 style="margin-top:4px">Care plan</h1>
  <p class="lead" style="color:var(--ink2);font-size:14.5px;margin-top:-8px">Lila’s emergency responses. Saved on this phone, so they open without a connection.</p>
  <div class="sec-h"><span class="eyebrow">Emergency responses</span></div>
  <div class="list">${RESP_ORDER.map(k=>{const r=RESP[k];const ready=r.status==='draft';const act=active().find(e=>evText(e).resp===k);
    return`<button class="row" data-act="resp" data-r="${k}" data-id="${act?act.id:''}"><span class="sev ${act?(act.level==='critical'?'crit':'att'):'done'}">${I(act?(act.level==='critical'?'oct':'tri'):'plan',17)}</span><span class="t"><b>${r.title}</b><small>${ready?r.steps.length+' steps · draft for care-team review':'Waiting for Lila’s care team'}</small></span>${act?`<span class="st ${act.level==='critical'?'crit':'att'}">Active</span>`:''}<span class="chev">${I('chev',16)}</span></button>`}).join('')}</div>
  <div class="sec-h"><span class="eyebrow">Care team</span></div>
  <div class="list"><button class="row" data-act="sheet" data-s="team">${I('phone',19,'color:var(--halo)')}<span class="t"><b>Lila’s care team</b><small>[Placeholder number]</small></span><span class="chev">${I('chev',16)}</span></button>
   <button class="row" data-act="sheet" data-s="911">${I('phone',19,'color:var(--crit)')}<span class="t"><b>Emergency services</b><small>911</small></span><span class="chev">${I('chev',16)}</span></button></div>
  <p class="note">Plan approved by Lila’s care team · [placeholder date]. AeroSense never writes care instructions on its own.</p></div>`;
  return shell(html);}

/* response overview (portrait) */
function respView(rk,id){const r=RESP[rk]||RESP.pressure;
  if(S.orient==='landscape')return dockResp(rk,id,0);
  if(r.status!=='draft'){const html=`<div class="pad">${backBtn()}${respCtx(id)}<span class="chip off">Not written yet</span><h2 class="ttl">${r.title}</h2>
    <p class="lead">Lila’s care team hasn’t added a response for this yet. AeroSense won’t make one up.</p>
    <div class="list"><button class="row" data-act="sheet" data-s="team">${I('phone',19,'color:var(--halo)')}<span class="t"><b>Call Lila’s care team</b><small>[Placeholder number]</small></span><span class="chev">${I('chev',16)}</span></button><button class="row" data-act="sheet" data-s="911">${I('phone',19,'color:var(--crit)')}<span class="t"><b>Emergency services</b><small>911</small></span><span class="chev">${I('chev',16)}</span></button></div></div>`;return shell(html);}
  const practice=!id&&S.stack[0].v==='more';
  const html=`<div class="pad">${backBtn()}${respCtx(id)}${practice?`<section class="band ok"><span class="bi">${I('info',18)}</span><span><b>Practice mode</b><small>No alarm is active. Walk through the steps to learn them.</small></span></section>`:''}${S.cp[rk]?`<span class="chip ok">${I('check',13)}Approved · J. Rivera</span>`:'<span class="chip draft">Draft · for care-team review</span>'}<h2 class="ttl">${r.title}</h2>
  <p class="lead">Work through these with Lila in front of you. Each step says what to do and what to look for.</p>
  <button class="btn ${(()=>{const e=id&&S.events.find(x=>x.id===id);return e&&e.level==='critical'&&!e.end?'crit':'pri'})()}" data-act="go" data-v="step" data-r="${rk}" data-step="1" data-id="${id||''}">Start at step 1${I('chev',16)}</button>
  <div class="list">${r.steps.map((s,i)=>`<button class="row" data-act="go" data-v="step" data-r="${rk}" data-step="${i+1}" data-id="${id||''}"><span class="sev done" style="background:var(--halo-bg);color:var(--halo);font-weight:700">${i+1}</span><span class="t"><b>${s.t}</b><small>${esc(s.do[0])}</small></span><span class="chev">${I('chev',16)}</span></button>`).join('')}</div>
  <button class="btn critout" data-act="sheet" data-s="911">${I('phone',18)}Call 911</button>
  <p class="note">${r.src}</p></div>`;
  return shell(html);}
function stepTop(rk,id,n,total){const e=id&&S.events.find(x=>x.id===id);const t=e&&evText(e);
  const strip=!e?`<div class="estrip prac">${I('info',16)}<span><b>Practice mode</b><small>No alarm is active</small></span></div>`
   :e.end?`<div class="estrip ok">${I('check',16)}<span><b>${t.title} · stopped ${hm(e.end)}</b><small>Keep watching Lila</small></span></div>`
   :`<div class="estrip">${I('oct',16)}<span><b>${t.title} · Active</b><small>${e.kind==='pressure'?'Silence or reset it at the ventilator only':t.dev+' · since '+hm(e.start)}</small></span></div>`;
  const hs=S.halo.st,vs=S.vent.st;const pipA=vs!=='off'&&S.v.pip>TH.pipLimit;
  const vt=(cls,ic,k,v,u)=>`<div class="ev ${cls}"><span class="k">${I(ic,13)}${k}</span><span class="v">${v}<small>${u}</small></span></div>`;
  const vit=`<div class="evit">${vt(hs==='off'?'na':spo2Tone(S.v.spo2),'o2','SpO₂',hs==='off'?'––':S.v.spo2,hs==='off'?'':'%')}${vt(hs==='off'?'na':S.v.hr>TH.hrHi?'att':'','heart','Pulse',hs==='off'?'––':S.v.hr,hs==='off'?'':'bpm')}${vt(vs==='off'?'na':pipA?'crit':'','gauge','Pressure',vs==='off'?'––':S.v.pip,vs==='off'?'':'cmH₂O')}</div>`;
  const bar=`<div class="stepbar" style="grid-template-columns:repeat(${total},1fr)">${Array.from({length:total},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
  return{strip,vit,bar,ended:e&&e.end};}
function stepCard(s,n,ended){return`<article class="estep"><div class="eh"><span class="en">${n}</span><h2>${s.t}</h2></div>
  <ul>${s.do.map(d=>`<li>${ctv(d)}</li>`).join('')}</ul>
  <div class="ejumps">${(s.jump||[]).map(([c,l,to])=>`<button class="jump crit" data-act="jump" data-to="${to}">${I('tri',16)}<span>${esc(l)}</span>Step ${to}${I('chev',14)}</button>`).join('')}
  ${ended?`<button class="jump ok" data-act="finish">${I('check',16)}<span>Lila is comfortable</span>Finish${I('chev',14)}</button>`:''}</div></article>`;}
function stepNav(n,total){return`<div class="navrow"><button class="btn sec" data-act="step" data-d="-1" ${n===1?'disabled':''}>${I('back',16)}Back</button>${n<total?`<button class="btn pri" data-act="step" data-d="1">Next${I('chev',16)}</button>`:`<button class="btn pri" data-act="finish">Finish${I('chev',16)}</button>`}</div>`;}
const call911=`<button class="btn crit" data-act="sheet" data-s="911">${I('phone',18)}Call 911</button>`;
function stepView(rk,id,n){const r=RESP[rk];if(n>r.steps.length)return doneView(rk,id);
  if(S.orient==='landscape')return dockResp(rk,id,n);
  const total=r.steps.length;const T=stepTop(rk,id,n,total);
  const notif='';
  return`<div class="screen app p">${sbar()}<div class="efix">
    <div class="etop"><button class="backbtn" data-act="closeSteps">${I('back',22)}Exit</button><span class="ecount">Step ${n} of ${total}</span></div>
    ${T.strip}${T.vit}${T.bar}${stepCard(r.steps[n-1],n,T.ended)}${stepNav(n,total)}${call911}</div>${tabbar()}${sheetHTML()}</div>`;}
function doneView(rk,id){const e=id&&S.events.find(x=>x.id===id);
  const body=`${S.orient==='landscape'?'':backBtn()}<span class="chip ok">${I('check',13)}End of response</span><h2 class="ttl">${e&&!e.end?'The alarm is still active.':'You’ve finished Lila’s steps.'}</h2>
  <p class="lead">${e&&!e.end?'Keep watching Lila. If she isn’t improving, call 911. Tell her care team what happened once she’s stable.':'Tell Lila’s care team what happened once she’s stable.'}</p>
  ${e?`<button class="btn pri" data-act="toAlert" data-id="${e.id}">Go to the alert</button>`:''}<button class="btn sec" data-act="toHome">${S.orient==='landscape'?'Back to docked view':'Go to Home'}</button>${call911}`;
  if(S.orient==='landscape')return dockDone(rk,id);
  if(false)return`<div class="screen app"><div class="dd"><div class="col">${respCtx(id)}</div><div class="col"><div class="box">${body}</div></div></div>${sheetHTML()}</div>`;
  return shell(`<div class="pad">${respCtx(id)}${body}</div>`);}

/* docked emergency response — same bedside language as the docked view.
   Band: alarm + exit + progress. Left: live vitals. Right: the step. Bottom: Back · Next · Call 911. */
function dockResp(rk,id,n){const r=RESP[rk];const e=id&&S.events.find(x=>x.id===id);const t=e&&evText(e);
  const total=r.steps?r.steps.length:0;
  const band=!e?`<div class="xb prac"><button class="xb-exit" data-act="closeSteps">${I('back',20)}Exit</button><span class="xb-t">${I('info',16)}Practice · no alarm is active</span>${n?`<span class="xb-c">Step ${n} of ${total}</span>`:'<span></span>'}</div>`
   :e.end?`<div class="xb ok"><button class="xb-exit" data-act="closeSteps">${I('back',20)}Exit</button><span class="xb-t">${I('check',16)}${t.title} stopped at ${hm(e.end)} · keep watching Lila</span>${n?`<span class="xb-c">Step ${n} of ${total}</span>`:'<span></span>'}</div>`
   :`<div class="xb ${e.level==='critical'?'':'att'}"><button class="xb-exit" data-act="closeSteps">${I('back',20)}Exit</button><span class="xb-t">${I('oct',16)}<b>${t.title}</b><span class="xb-s">Active since ${hm(e.start)}${e.kind==='pressure'?' · silence only at the ventilator':''}</span></span>${n?`<span class="xb-c">Step ${n} of ${total}</span>`:'<span></span>'}</div>`;
  const hs=S.halo.st,vs=S.vent.st;const pipA=vs!=='off'&&S.v.pip>TH.pipLimit;
  const v=(k,val,u,c)=>`<div class="xv ${c}"><span class="k">${k}</span><span class="n">${val}${u?`<small>${u}</small>`:''}</span></div>`;
  const vit=`<aside class="xvit" aria-label="Live readings">${v('SpO₂',hs==='off'?'––':S.v.spo2,hs==='off'?'':'%',hs==='off'?'na':spo2Tone(S.v.spo2))}${v('Pulse',hs==='off'?'––':S.v.hr,hs==='off'?'':'bpm',hs==='off'?'na':S.v.hr>TH.hrHi?'att':'')}${v('Pressure',vs==='off'?'––':S.v.pip,vs==='off'?'':'cmH₂O',vs==='off'?'na':pipA?'crit':'')}</aside>`;
  const call=`<button class="xbtn crit" data-act="sheet" data-s="911">${I('phone',18)}Call 911</button>`;
  if(r.status!=='draft')return`<div class="screen app"><div class="xr">${band}<div></div><div class="xg">${vit}<section class="xstep"><span class="xph">Not written yet</span><h2>${r.title}</h2><p class="xlead">Lila’s care team hasn’t added a response for this yet. AeroSense won’t make one up.</p></section></div><div class="xact">${call}<span></span><span></span></div></div>${sheetHTML()}</div>`;
  if(!n){return`<div class="screen app"><div class="xr">${band}<div></div><div class="xg">${vit}<section class="xstep">${S.cp[rk]?'<span class="xph">Approved · J. Rivera</span>':'<span class="xph">Draft · for care-team review</span>'}<h2>${r.title}</h2>
    <ol class="xlist">${r.steps.map((s,i)=>`<li><button data-act="jump" data-to="${i+1}"><i>${i+1}</i>${s.t}</button></li>`).join('')}</ol></section></div>
    <div class="xact">${call}<button class="xbtn pri" data-act="jump" data-to="1" style="grid-column:span 2">Start at step 1${I('chev',16)}</button></div></div>${sheetHTML()}</div>`;}
  const s=r.steps[n-1];
  const prog=`<div class="xprog" style="grid-template-columns:repeat(${total},1fr)">${r.steps.map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
  const jumps=(s.jump||[]).map(([c,l,to])=>`<button class="xjump" data-act="jump" data-to="${to}">${I('tri',16)}<span>${esc(l)}</span><b>Go to step ${to}</b>${I('chev',14)}</button>`).join('')+(e&&e.end?`<button class="xjump ok" data-act="finish">${I('check',16)}<span>Lila is comfortable</span><b>Finish</b>${I('chev',14)}</button>`:'');
  return`<div class="screen app"><div class="xr">${band}${prog}<div class="xg">${vit}
    <section class="xstep"><div class="xh"><span class="xn">${n}</span><h2>${s.t}</h2></div><ul>${s.do.map(d=>`<li>${ctv(d)}</li>`).join('')}</ul>${jumps?`<div class="xjumps">${jumps}</div>`:''}</section></div>
    <div class="xact">${call}<button class="xbtn sec" data-act="step" data-d="-1" ${n===1?'disabled':''}>${I('back',16)}Back</button>${n<total?`<button class="xbtn pri" data-act="step" data-d="1">Next step${I('chev',16)}</button>`:`<button class="xbtn pri" data-act="finish">Finish${I('chev',16)}</button>`}</div></div>${sheetHTML()}</div>`;}
function dockDone(rk,id){const e=id&&S.events.find(x=>x.id===id);
  return`<div class="screen app"><div class="xr"><div class="xb ok"><span></span><span class="xb-t">${I('check',16)}End of Lila’s steps</span><span></span></div><div></div><div class="xg one"><section class="xstep"><h2>${e&&!e.end?'The alarm is still active.':'You’ve finished Lila’s steps.'}</h2><p class="xlead">${e&&!e.end?'Keep watching Lila. If she isn’t improving, call 911. Tell her care team once she’s stable.':'Tell Lila’s care team what happened once she’s stable.'}</p></section></div>
   <div class="xact done"><button class="xbtn crit" data-act="sheet" data-s="911">${I('phone',18)}Call 911</button><button class="xbtn sec" data-act="toHome">Back to docked view</button>${e&&!e.end?`<button class="xbtn pri" data-act="go" data-v="step" data-r="${rk}" data-step="1" data-id="${id}">Start over at step 1</button>`:'<span></span>'}</div></div>${sheetHTML()}</div>`;}

/* ---------- sheets ---------- */
function sheetHTML(){if(!S.sheet)return'';const s=S.sheet;
  const body={team:`<h3>Lila’s care team</h3><div class="sel">[Placeholder number — from Lila’s care plan]</div><p class="note">Prototype: no call is placed. The real app would open the phone dialer.</p>`,
   '911':`<h3>Emergency services</h3><div class="sel">911</div><p class="note">Prototype: no call is placed. The real app would open the phone dialer.</p>`,
   about:`<h3>About these readings</h3><p class="note" style="font-size:14px">This is a design prototype for usability testing. All values, thresholds and events are simulated and not clinically validated. HALO sensing is a concept. AeroSync alarms sound and are managed at the ventilator, independent of this phone — don’t rely on this phone as the only alarm.</p>`,
   prio:`<h3>Alert priorities</h3><div class="key"><span><i class="kd crit"></i><span><b>High</b> · a ventilator alarm or a critical reading. Go to Lila now.</span></span><span><i class="kd att"></i><span><b>Medium</b> · a reading outside Lila\u2019s set range. Check on her.</span></span><span><i class="kd low"></i><span><b>Low</b> · a connection or data problem. Readings may be missing.</span></span></div><p class="note">Active alerts have a tinted background. Past alerts keep their color.</p>`,
   invite:`<h3>Invite a caregiver</h3><p class="note" style="font-size:14px">They get Lila\u2019s alerts and care plan on their own phone after they accept.</p><div class="sel" style="font-size:15px;font-weight:500;color:var(--ink2);user-select:none">Phone number or email</div><p class="note">Prototype: invites aren\u2019t sent.</p>`,
   ap:apSheet(),
   teamlist:`<h3>Lila’s care team</h3><div class="sel" style="font-size:15px">[Pulmonologist — placeholder]</div><div class="sel" style="font-size:15px">[Respiratory therapist — placeholder]</div><div class="sel" style="font-size:15px">[Home-care nursing — placeholder]</div>`}[s]||'';
  return`<div class="sheet-bg" data-act="sheetClose"><div class="sheet" role="dialog" aria-modal="true">${body}<button class="btn sec" data-act="sheetClose">Close</button></div></div>`;}

/* ---------- readings: metrics, series, charts ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MOVE=['Low','Moderate','High'];
const MET={
 spo2:{n:'Oxygen',ab:'SpO₂',u:'%',dev:'HALO',ic:'o2',base:97,noise:1,lo:82,hi:100,set:[92,100],crit:88,usual:'96–98%',ev:['lowspo2'],about:'How much oxygen Lila’s blood is carrying, read by HALO’s side sensor at her neck.'},
 hr:{n:'Pulse',u:'bpm',dev:'HALO',ic:'heart',base:112,noise:5,lo:60,hi:160,set:[80,140],usual:'105–120 bpm',ev:[],about:'Heartbeats per minute, read by HALO’s side sensor.'},
 temp:{n:'Skin temperature',short:'Skin temp',u:'°C',dev:'HALO',ic:'thermo',base:36.7,noise:.15,dp:1,lo:35.5,hi:38.5,usual:'36.4–37.2 °C',ev:[],about:'Temperature of Lila’s skin under HALO. Skin reads lower than core body temperature.'},
 move:{n:'Movement',u:'',dev:'HALO',ic:'move',cat:MOVE,base:0,ev:[],about:'How active Lila is, from HALO’s motion sensor: low, moderate or high.'},
 airway:{n:'Airway',u:'',dev:'HALO',ic:'sound',cat:['Clear','Possible secretions'],base:0,ev:['sound'],about:'Changes in the acoustic signal at Lila’s airway. Concept sensing — it can’t say what caused a change.'},
 rr:{n:'Breathing rate',ab:'RR',u:'/min',dev:'AeroSync',ic:'lungs',base:24,noise:1,lo:10,hi:40,set:[20,30],ev:[],about:'Breaths per minute delivered or triggered, from the ventilator.'},
 pip:{n:'Peak pressure',ab:'PIP',u:'cmH₂O',dev:'AeroSync',ic:'gauge',base:18,noise:1,lo:5,hi:40,set:[0,30],limitOnly:true,ev:['pressure'],about:'The highest airway pressure in each breath. The ventilator alarms above its limit.'},
 vt:{n:'Air per breath',ab:'VTe',u:'mL',dev:'AeroSync',ic:'lungs',base:85,noise:2,lo:40,hi:120,set:[70,110],ev:['pressure'],about:'How much air each breath delivers (tidal volume).'}};
const HALO_M=['spo2','hr','temp','move','airway'],VENT_M=['rr','pip','vt'];
const RANGE={'30m':[60,30e3,'30 minutes'],'24h':[96,15*60e3,'24 hours'],'7d':[84,2*3600e3,'7 days']};
function curVal(mid){const v=S.v;return{spo2:v.spo2,hr:v.hr,temp:v.temp,move:MOVE.indexOf(v.move),airway:active().some(e=>e.kind==='sound')?1:0,rr:v.rr,pip:v.pip,vt:v.vt}[mid];}
function devOf(mid){return MET[mid].dev==='HALO'?S.halo:S.vent;}
function mStatus(mid,v){const m=MET[mid];if(v==null)return{c:'na',t:'No data'};
  if(mid==='spo2'){if(v<TH.spo2Crit)return{c:'crit',t:'Below critical threshold ('+TH.spo2Crit+'%)'};if(v<TH.spo2Lo)return{c:'att',t:'Below set range'};return{c:'ok',t:'Within set range'};}
  if(mid==='pip')return v>TH.pipLimit?{c:'crit',t:'Above alarm limit (30)'}:{c:'ok',t:'Below alarm limit'};
  if(mid==='airway')return v?{c:'att',t:'Possible secretions'}:{c:'ok',t:'Clear'};
  if(mid==='move')return{c:'ok',t:MOVE[v]+' activity'};
  if(mid==='temp')return{c:'ok',t:'Usual for Lila'};
  if(m.set){if(v<m.set[0])return{c:'att',t:'Below set range'};if(v>m.set[1])return{c:'att',t:'Above set range'};}
  return{c:'ok',t:'Within set range'};}
const fmtV=(mid,v)=>{const m=MET[mid];if(v==null)return'No data';if(m.cat)return m.cat[v];return(m.dp?v.toFixed(m.dp):v)+(m.u?(m.u==='%'?'%':' '+m.u):'');};
function seriesFor(mid,range){const m=MET[mid];const n=now();const [cnt,step]=RANGE[range];
  let seed=range.length*977;for(const c of mid)seed+=c.charCodeAt(0)*31;const rnd=mulberry(seed);const pts=[];
  const dv=devOf(mid);const offKind=m.dev==='HALO'?'halo_off':'vent_off';
  for(let i=0;i<cnt;i++){const tm=new Date(n-(cnt-1-i)*step);
    let v=m.cat?(mid==='move'?(rnd()<.15?1:0):0):m.base+(rnd()-.5)*2*m.noise;let gap=false;
    for(const e of S.events){const end=e.end||n;if(!(tm>=new Date(e.start-step/2)&&tm<=new Date(+end+step/2)))continue;
      if(e.kind===offKind)gap=true;
      if(e.kind==='lowspo2'){if(mid==='spo2')v=e.end?e.value:Math.min(e.value,S.v.spo2);if(mid==='hr')v=e.level==='critical'?141:126;}
      if(e.kind==='pressure'){if(mid==='pip')v=e.peak||34;if(mid==='vt')v=62;if(mid==='rr')v=28;if(mid==='hr')v=Math.max(v,130);if(mid==='spo2')v=Math.min(v,94);}
      if(e.kind==='sound'){if(mid==='airway')v=1;if(mid==='hr')v=Math.max(v,124);}}
    if(dv.st!=='live'&&tm>=dv.since)gap=true;
    if(i===cnt-1&&dv.st==='live')v=curVal(mid);
    if(!m.cat&&!gap)v=m.dp?Math.round(v*10)/10:Math.round(v);
    pts.push({t:tm,v:gap?null:v});}
  return{pts,start:pts[0].t,end:n};}
function evInWindow(ser,filter){return S.events.filter(e=>(e.end||now())>=ser.start&&e.start<=ser.end&&(!filter||filter(e))).sort((a,b)=>b.start-a.start);}
function episodes(mid,ser){const step=RANGE[S.range][1];const eps=[];let cur=null;
  ser.pts.forEach(p=>{const st=p.v==null?null:mStatus(mid,p.v).c;const bad=st==='att'||st==='crit';
    if(bad){if(!cur){cur={start:p.t,n:0,crit:false,dir:null};eps.push(cur);}cur.n++;if(st==='crit')cur.crit=true;
      const m=MET[mid];if(m.set)cur.dir=p.v<m.set[0]?'below':'above';}else cur=null;});
  const evK={spo2:['lowspo2'],pip:['pressure'],vt:['pressure']}[mid];
  if(evK){const evs=evInWindow(ser,e=>evK.includes(e.kind)).sort((x,y)=>x.start-y.start);
    if(evs.length)return{count:evs.length,mins:evs.reduce((s2,e)=>s2+Math.max(1,Math.round(((e.end||now())-e.start)/60000)),0),crit:evs.some(e=>e.level==='critical'||(mid==='spo2'&&e.value<TH.spo2Crit)),dir:mid==='pip'?'above':'below',last:evs[evs.length-1].start};}
  const mins=step<=15*60000?eps.reduce((a,e)=>a+Math.max(1,Math.round(e.n*step/60000)),0):null;
  return{count:eps.length,mins,crit:eps.some(e=>e.crit),dir:eps.length?eps[0].dir:null,last:eps.length?eps[eps.length-1].start:null};}
const durTxt=m=>m==null?'':m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
function epSummary(mid,ser){const m=MET[mid];
  if(mid==='airway'){const n=evInWindow(ser,e=>e.kind==='sound').length;return n?{t:`Possible secretions ${n===1?'once':n+' times'}`,c:'att'}:{t:'Clear',c:'ok'};}
  if(mid==='move')return{t:'Mostly low',c:'ok'};
  if(!ser.pts.some(p=>p.v!=null))return{t:'No data',c:'na'};
  const e=episodes(mid,ser);if(!e.count)return{t:mid==='temp'?'Usual for Lila':mid==='pip'?'Stayed below limit':'Stayed in range',c:'ok'};
  const word=mid==='pip'?'Above limit':e.crit&&mid==='spo2'?'Below critical':e.dir==='above'?'Above range':'Below range';
  return{t:`${word} ${e.count===1?'once':e.count+' times'}${e.mins!=null?' · '+durTxt(e.mins):''}`,c:e.crit?'crit':'att'};}
function typical(mid,ser){const v=ser.pts.map(p=>p.v).filter(x=>x!=null).sort((a,b)=>a-b);if(!v.length)return null;return v[Math.floor(v.length/2)];}
function inRangePct(mid,ser){const v=ser.pts.filter(p=>p.v!=null);if(!v.length)return null;return Math.round(100*v.filter(p=>mStatus(mid,p.v).c==='ok').length/v.length);}
function bigChart(mid,ser){const m=MET[mid];const W=330,H=150,pl=4,pr=4,pt=10,pb=22;
  const lo=m.cat?-.5:m.lo,hi=m.cat?m.cat.length-.5:m.hi;
  const x=i=>pl+(W-pl-pr)*i/(ser.pts.length-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const tx=tm=>pl+(W-pl-pr)*(tm-ser.start)/(ser.end-ser.start);
  let band='';
  if(m.set&&!m.cat){const b0=m.limitOnly?lo:m.set[0],b1=m.set[1];band=`<rect x="${pl}" y="${y(b1)}" width="${W-pl-pr}" height="${y(b0)-y(b1)}" fill="#DDEEF1"/><line x1="${pl}" x2="${W-pr}" y1="${y(b1)}" y2="${y(b1)}" stroke="#86BCC6"/>${m.limitOnly?'':`<line x1="${pl}" x2="${W-pr}" y1="${y(b0)}" y2="${y(b0)}" stroke="#86BCC6"/>`}<text x="${pl+4}" y="${y(b1)+11}" font-size="10" fill="#147585" font-weight="600">${m.limitOnly?'Alarm limit '+b1:'Set '+b0+'–'+b1}</text>`;}
  if(m.crit)band+=`<line x1="${pl}" x2="${W-pr}" y1="${y(m.crit)}" y2="${y(m.crit)}" stroke="#C4362F" stroke-width="1"/><text x="${W-pr-4}" y="${y(m.crit)-4}" font-size="10" fill="#A92A23" text-anchor="end" font-weight="600">Critical ${m.crit}</text>`;
  if(m.cat)band=m.cat.map((c,i)=>`<line x1="${pl}" x2="${W-pr}" y1="${y(i)}" y2="${y(i)}" stroke="#E4E1D9"/><text x="${pl+2}" y="${y(i)-4}" font-size="10" fill="#5E7080">${c}</text>`).join('');
  const evs=evInWindow(ser,e=>e.level!=='info');
  const marks=evs.map(e=>{const xs=Math.max(pl,tx(e.start)),xe=Math.min(W-pr,tx(e.end||now()));const p=PRI[e.level];
    if(e.level==='conn')return(e.device===m.dev)?`<rect x="${xs}" y="${pt}" width="${Math.max(2,xe-xs)}" height="${H-pt-pb}" fill="#8A98A3" opacity=".22"/>`:'';
    return`<rect x="${xs}" y="${pt}" width="${Math.max(2.5,xe-xs)}" height="${H-pt-pb}" fill="${p.c==='crit'?'#C4362F':'#E3A63B'}" opacity="${MET[mid].ev.includes(e.kind)?.85:.3}"/>`}).join('');
  const dv=devOf(mid);const shade=dv.st!=='live'?`<rect x="${tx(dv.since)}" y="${pt}" width="${Math.max(2,W-pr-tx(dv.since))}" height="${H-pt-pb}" fill="#8A98A3" opacity=".25"/>`:'';
  let d='',pen=false;ser.pts.forEach((p,i)=>{if(p.v==null){pen=false;return;}const yy=y(p.v).toFixed(1);d+=(pen?(m.cat?'H'+x(i).toFixed(1)+' V'+yy:'L'+x(i).toFixed(1)+' '+yy):'M'+x(i).toFixed(1)+' '+yy)+' ';pen=true;});
  const outs=m.cat?'':ser.pts.map((p,i)=>p.v!=null&&mStatus(mid,p.v).c!=='ok'?`<circle cx="${x(i)}" cy="${y(p.v)}" r="2.8" fill="${mStatus(mid,p.v).c==='crit'?'#C4362F':'#B87A12'}"/>`:'').join('');
  const labs=[0,.33,.66,1].map(f=>{const tm=new Date(+ser.start+(ser.end-ser.start)*f);const l=f===1?'now':S.range==='7d'?tm.toLocaleDateString('en-US',{weekday:'short'}):hm(tm).replace(':00','');return`<text x="${pl+(W-pl-pr)*f}" y="${H-6}" font-size="10" fill="#5E7080" text-anchor="${f===0?'start':f===1?'end':'middle'}">${l}</text>`}).join('');
  const pi=S.point&&S.point.k===mid?S.point.i:null;
  const sel=pi!=null&&ser.pts[pi]?`<line x1="${x(pi)}" x2="${x(pi)}" y1="${pt}" y2="${H-pb}" stroke="#2F4554"/>${ser.pts[pi].v!=null?`<circle cx="${x(pi)}" cy="${y(ser.pts[pi].v)}" r="5" fill="#fff" stroke="#2F4554" stroke-width="2"/>`:''}`:'';
  const last=ser.pts[ser.pts.length-1].v;const col=m.dev==='HALO'?'#147585':'#4A5E86';
  return`<svg viewBox="0 0 ${W} ${H}" data-chart="${mid}" role="img" aria-label="${m.n} over ${RANGE[S.range][2]}. Tap to inspect a point.">${band}${marks}${shade}<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>${outs}${last!=null?`<circle cx="${x(ser.pts.length-1)}" cy="${y(last)}" r="3.5" fill="${col}"/>`:''}${sel}${labs}</svg>`;}
function tip(mid,ser){if(!S.point||S.point.k!==mid)return'';const p=ser.pts[S.point.i];if(!p)return'';
  const during=S.events.filter(e=>p.t>=e.start&&p.t<=(e.end||now())&&e.level!=='info').map(e=>evText(e).title);const st=p.v!=null&&mStatus(mid,p.v);
  const left=Math.min(Math.max(0,S.point.i/(ser.pts.length-1)*100-30),46);
  return`<div class="tip" style="left:${left}%"><span style="opacity:.8">${fmt(p.t)}</span><b>${fmtV(mid,p.v)}${st&&st.c!=='ok'?' · '+st.t.toLowerCase():''}</b>${during.length?'During: '+during.join(', '):''}</div>`;}
function spark(mid,ser){const m=MET[mid];const W=72,H=28;const lo=m.cat?-.5:m.lo,hi=m.cat?m.cat.length-.5:m.hi;
  const x=i=>W*i/(ser.pts.length-1),y=v=>2+(H-4)*(1-(v-lo)/(hi-lo));let d='',pen=false;
  ser.pts.forEach((p,i)=>{if(p.v==null){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' ';pen=true;});
  const band=m.set&&!m.cat?`<rect x="0" y="${y(m.set[1])}" width="${W}" height="${y(m.limitOnly?lo:m.set[0])-y(m.set[1])}" fill="#DDEEF1"/>`:'';
  const outs=m.cat?ser.pts.map((p,i)=>p.v&&mid==='airway'?`<rect x="${x(i)-1}" y="2" width="2.5" height="${H-4}" fill="#E3A63B"/>`:'').join(''):ser.pts.map((p,i)=>p.v!=null&&mStatus(mid,p.v).c!=='ok'?`<circle cx="${x(i)}" cy="${y(p.v)}" r="2" fill="${mStatus(mid,p.v).c==='crit'?'#C4362F':'#B87A12'}"/>`:'').join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${band}<path d="${d}" fill="none" stroke="${m.dev==='HALO'?'#147585':'#4A5E86'}" stroke-width="1.6"/>${outs}</svg>`;}
const segHTML=()=>`<div class="seg" role="group" aria-label="Time range">${['7d','24h','30m'].map(k=>[k,RANGE[k]]).map(([k,v])=>`<button data-act="range" data-r="${k}" aria-pressed="${S.range===k}">${k==='30m'?'30 min':k==='24h'?'24 hours':'7 days'}</button>`).join('')}</div>`;

/* Trends = overview hub: "How has Lila been?" → per-reading summary → reading page */
function trendsView(){const rl=RANGE[S.range][2];
  const any=seriesFor('spo2',S.range);const evs=evInWindow(any,e=>e.level!=='info');
  const cnt=l=>evs.filter(e=>e.level===l).length;const actN=evs.filter(e=>!e.end).length;
  const outM=[...HALO_M,...VENT_M].filter(mid=>{const s=seriesFor(mid,S.range);return s.pts.some(p=>p.v!=null&&mStatus(mid,p.v).c!=='ok');});
  const head=actN?'An alert is active now':!evs.length&&!outM.length?'Lila stayed within her ranges':`${evs.length} alert${evs.length===1?'':'s'} in the last ${rl}`;
  const body=outM.length?'Went outside range: '+outM.map(m=>MET[m].n.toLowerCase()).join(', ')+'. Tap a reading to see when.':'Every reading stayed within Lila’s set ranges.';
  const row=mid=>{const m=MET[mid];const s=seriesFor(mid,S.range);const pct=inRangePct(mid,s);const dv=devOf(mid);const cv=dv.st==='off'?null:curVal(mid);const st=mStatus(mid,cv);
    const es=epSummary(mid,s);const summ=es.t,sc=es.c;
    return`<button class="row trow" data-act="metric" data-m="${mid}">${I(m.ic,18,'color:'+(m.dev==='HALO'?'var(--halo)':'var(--vent)'))}<span class="t"><b>${m.short||m.n}</b><small class="sumc ${sc}">${summ}</small></span>${spark(mid,s)}<span class="now ${st.c}">${dv.st==='off'?'—':fmtV(mid,cv).replace(' /min','').replace(' cmH₂O','').replace(' mL','').replace(' bpm','').replace(' °C','°')}</span><span class="chev">${I('chev',16)}</span></button>`;};
  const W=330;const tx=tm=>W*(tm-any.start)/(any.end-any.start);
  const strip=`<svg viewBox="0 0 ${W} 40" width="100%" aria-label="Alerts over ${rl}"><rect x="0" y="12" width="${W}" height="14" rx="7" fill="#EEECE6"/>${evs.map(e=>{const p=PRI[e.level];const xs=Math.max(0,tx(e.start)),w=Math.max(5,tx(e.end||now())-xs);return`<rect x="${Math.min(xs,W-5)}" y="12" width="${w}" height="14" rx="3" fill="${p.c==='crit'?'#C4362F':p.c==='att'?'#E3A63B':'#8A98A3'}"/>`}).join('')}<text x="0" y="38" font-size="10" fill="#5E7080">${S.range==='7d'?'7 days ago':S.range==='24h'?'24 h ago':'30 min ago'}</text><text x="${W}" y="38" font-size="10" fill="#5E7080" text-anchor="end">now</text></svg>`;
  const html=`<div class="pad"><h1 style="margin-top:6px">Trends</h1><p class="lead" style="color:var(--ink2);font-size:14.5px;margin-top:-10px">How Lila has been over time. Tap a reading to see its graph.</p>
  ${segHTML()}
  <section class="sum"><span class="eyebrow">Last ${rl}</span><b style="margin-top:4px">${head}</b><p>${body}</p>
   ${evs.length?`<div class="cnts">${cnt('critical')?`<span class="prio crit">${cnt('critical')} High</span>`:''}${cnt('attention')?`<span class="prio att">${cnt('attention')} Medium</span>`:''}${cnt('conn')?`<span class="prio low">${cnt('conn')} Low</span>`:''}</div>${strip}`:''}</section>
  <section class="dev id-halo"><div class="dev-h"><span class="id">${I('halo',20)}</span><span class="nm"><b>HALO</b><small>Lila’s readings</small></span>${pill(S.halo.st)}</div><div class="rows">${HALO_M.map(row).join('')}</div></section>
  <section class="dev id-vent"><div class="dev-h"><span class="id">${I('vent',20)}</span><span class="nm"><b>AeroSync</b><small>Ventilation</small></span>${pill(S.vent.st)}</div><div class="rows">${VENT_M.map(row).join('')}</div></section>
  ${evs.length?`<div class="sec-h"><span class="eyebrow">Alerts in the last ${rl}</span></div><div class="list">${evs.map(evRow).join('')}</div>`:''}
  <p class="note">Simulated data — not clinical measurements.</p></div>`;
  return shell(html);}

/* Reading page: one measurement in depth */
const WHAT={spo2:'The share of Lila’s blood that is carrying oxygen, measured by HALO’s sensor at her neck.',
 hr:'How many times Lila’s heart beats each minute.',
 temp:'The temperature of Lila’s skin under HALO. Skin reads a little lower than core body temperature.',
 move:'How active Lila is, from HALO’s motion sensor.',
 airway:'Changes in the sound of air moving at Lila’s trach. A concept sensor — it can’t say what caused a change.',
 rr:'How many breaths Lila gets each minute, from the ventilator.',
 pip:'The highest pressure in Lila’s airway during each breath. The ventilator alarms if it goes above its limit.',
 vt:'How much air goes into Lila’s lungs with each breath.'};
function zonesOf(mid){const m=MET[mid];const Z=(a,b,c,l)=>({a,b,c,l});
  if(mid==='spo2')return[Z(m.lo,m.crit,'crit','Critical'),Z(m.crit,m.set[0],'att','Below range'),Z(m.set[0],m.set[1],'ok','Set range')];
  if(mid==='pip')return[Z(m.lo,TH.pipLimit,'ok','Below limit'),Z(TH.pipLimit,m.hi,'crit','Alarm')];
  if(mid==='temp')return[Z(m.lo,36.4,'neu','Lower'),Z(36.4,37.2,'ok','Lila’s usual'),Z(37.2,m.hi,'neu','Higher')];
  return[Z(m.lo,m.set[0],'att','Below range'),Z(m.set[0],m.set[1],'ok','Set range'),Z(m.set[1],m.hi,'att','Above range')];}
function gaugeHTML(mid,v){const m=MET[mid];
  if(m.cat){return`<div class="cgauge" role="img" aria-label="${m.n}: ${v==null?'no data':m.cat[v]}">${m.cat.map((c,i)=>`<span class="${v===i?(mid==='airway'&&i?'on att':'on'):''}">${c}</span>`).join('')}</div>`;}
  const Zs=zonesOf(mid);const pos=x=>Math.max(0,Math.min(100,(x-m.lo)/(m.hi-m.lo)*100));
  const ticks=[...new Set(Zs.slice(1).map(z=>z.a))];
  const vz=v==null?null:Zs.find(z=>v>=z.a&&v<z.b)||Zs[Zs.length-1];
  return`<div class="gauge" role="img" aria-label="${m.n} ${v==null?'no data':fmtV(mid,v)+', '+vz.l}">
   <div class="gbar">${Zs.map(z=>`<i class="z ${z.c}" style="left:${pos(z.a)}%;width:${pos(z.b)-pos(z.a)}%"></i>`).join('')}
    ${v!=null?`<b class="gm ${vz.c}" style="left:${pos(v)}%"></b>`:''}</div>
   <div class="gticks">${ticks.map(t=>`<span style="left:${pos(t)}%">${t}</span>`).join('')}</div>
   <div class="gzones">${Zs.map(z=>`<span class="${vz===z?'cur '+z.c:''}" style="left:${pos(z.a)}%;width:${pos(z.b)-pos(z.a)}%">${z.l}</span>`).join('')}</div></div>`;}
